name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    # Springroll currently ships a macOS-only credential boundary. Running the
    # full application suite on Linux closes the stdio process as soon as the
    # app initializes its Keychain-backed credential store.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
