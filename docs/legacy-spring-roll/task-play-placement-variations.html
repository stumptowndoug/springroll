<meta charset="utf-8">
<title>The Play Seat — strip stays, five placements</title>
<style>
  /* Spring Roll tokens (assets/css/app.css, rice paper 2026-07-14) */
  :root {
    --bg: #fdfcfa;
    --bg-2: #f4f3ee;
    --ink: #3a382f;
    --muted: #7d7b74;
    --faint: #aeaca4;
    --border-strong: #d8d6d0;
    --hover: rgb(58 56 47 / 0.06);
    --active: rgb(58 56 47 / 0.1);
    --accent: #3f8f63;
    --accent-text: #357953;
    --accent-ink: #ffffff;
    --primary: #357953;
    --ok: #3f8f63;
    --run: #d98232;
    --fail: #c65346;
    --sans: "Inter", system-ui, -apple-system, sans-serif;
    --pop: 0 4px 16px rgb(15 15 15 / 0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e1e; --bg-2: #262626; --ink: #e6e4e0; --muted: #9b9a96; --faint: #6f6e6a;
      --border-strong: #474744; --hover: rgb(255 255 255 / 0.055); --active: rgb(255 255 255 / 0.09);
      --accent: #3f8f63; --accent-text: #7cc296; --primary: #357953;
      --ok: #5bab80; --run: #e0934f; --fail: #e06a58;
      --pop: 0 4px 16px rgb(0 0 0 / 0.45);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1e1e1e; --bg-2: #262626; --ink: #e6e4e0; --muted: #9b9a96; --faint: #6f6e6a;
    --border-strong: #474744; --hover: rgb(255 255 255 / 0.055); --active: rgb(255 255 255 / 0.09);
    --accent: #3f8f63; --accent-text: #7cc296; --primary: #357953;
    --ok: #5bab80; --run: #e0934f; --fail: #e06a58;
    --pop: 0 4px 16px rgb(0 0 0 / 0.45);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #fdfcfa; --bg-2: #f4f3ee; --ink: #3a382f; --muted: #7d7b74; --faint: #aeaca4;
    --border-strong: #d8d6d0; --hover: rgb(58 56 47 / 0.06); --active: rgb(58 56 47 / 0.1);
    --accent: #3f8f63; --accent-text: #357953; --primary: #357953;
    --ok: #3f8f63; --run: #d98232; --fail: #c65346;
    --pop: 0 4px 16px rgb(15 15 15 / 0.12);
    color-scheme: light;
  }

  html { -webkit-font-smoothing: antialiased; }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.6; margin: 0; }

  .study { position: sticky; top: 0; z-index: 10; background: var(--bg); padding: 14px 20px 10px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
  .study h1 { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 auto 0 0; }
  .tabs { display: flex; flex-wrap: wrap; gap: 2px; background: var(--bg-2); border-radius: 8px; padding: 3px; }
  .tabs button { font: 500 13px/1.4 var(--sans); color: var(--muted); background: transparent; border: 0; border-radius: 6px; padding: 4px 11px; cursor: pointer; }
  .tabs button:hover { color: var(--ink); }
  .tabs button[aria-selected="true"] { background: var(--bg); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgb(15 15 15 / 0.06); }
  .tabs button:focus-visible, .theme button:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tabs .k { color: var(--faint); font-weight: 400; margin-right: 5px; }
  .theme button { font: 500 12px/1 var(--sans); background: transparent; color: var(--faint); border: 0; border-radius: 6px; padding: 6px 8px; cursor: pointer; }
  .theme button:hover { color: var(--ink); }

  .caption { max-width: 720px; margin: 4px auto 0; padding: 0 24px; text-align: center; font-size: 14px; color: var(--muted); }
  .caption strong { color: var(--ink); font-weight: 600; }

  .screen { display: none; padding: 28px 24px 96px; }
  .screen.active { display: block; }
  .sheet { max-width: 720px; margin: 0 auto; }

  .pagehead { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
  .pagehead h2 { font-size: 16px; font-weight: 600; margin: 0; color: var(--ink); }
  .pagehead span { font-size: 13px; color: var(--faint); }

  /* ---- the card ---- */
  .card { margin: 0 -16px; padding: 16px 16px; border-radius: 12px; transition: background 0.12s; }
  .card:hover { background: var(--hover); }
  .card .title { font-size: 17px; font-weight: 600; line-height: 1.35; color: var(--ink); margin: 0; cursor: pointer; }
  .card .title:hover { color: var(--accent-text); }
  .card.paused .title { color: var(--muted); font-weight: 500; }
  .card .desc { font-size: 14px; line-height: 1.55; color: var(--muted); margin: 3px 0 0;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card.paused .desc { color: var(--faint); }

  .toprow { display: flex; align-items: flex-start; gap: 24px; }
  .toprow .id { min-width: 0; flex: 1; }
  .toprow.centered { align-items: center; }

  .foot { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; margin-top: 12px; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 14px; min-width: 0;
    font-size: 13px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .meta .stat { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .meta svg { width: 13px; height: 13px; flex: none; }
  .meta .bad { color: var(--fail); }
  .meta .live { color: var(--run); }
  .spacer { flex: 1; }
  .acts { display: flex; align-items: center; gap: 6px; flex: none; }
  .foot.verbs { margin-top: 8px; }
  .foot.verbs .acts { margin-left: -9px; gap: 4px; }

  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .dot.run { background: var(--run); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) { .dot.run, .bars i.live { animation: none; } }

  /* ---- the week strip, bare (the live app's) ---- */
  .bars { display: flex; align-items: flex-end; gap: 4px; height: 26px; flex: none; }
  .bars i { width: 12px; border-radius: 2px 2px 0 0; background: var(--ok); }
  .bars i.fail { background: var(--fail); }
  .bars i.live { background: var(--run); animation: pulse 1.6s ease-in-out infinite; }
  .bars i.stub { background: var(--border-strong); opacity: 0.55; border-radius: 1px; }
  .bars.mini { height: 18px; gap: 3px; }
  .bars.mini i { width: 7px; }

  /* ---- buttons ---- */
  .playring { width: 36px; height: 36px; border-radius: 8px; flex: none; background: var(--bg-2);
    display: grid; place-items: center; color: var(--ink); border: 0; cursor: pointer; transition: background 0.12s, color 0.12s; }
  .playring:hover { background: var(--accent); color: var(--accent-ink); }
  .playring svg { width: 15px; height: 15px; margin-left: 1px; }

  .playfill { width: 40px; height: 40px; border-radius: 50%; flex: none; background: var(--primary); color: var(--accent-ink);
    border: 0; cursor: pointer; display: grid; place-items: center; transition: transform 0.12s, filter 0.12s; }
  .playfill:hover { filter: brightness(1.08); transform: scale(1.05); }
  .playfill svg { width: 16px; height: 16px; margin-left: 2px; fill: currentColor; stroke: none; }
  .playfill svg.stroked { fill: none; stroke: currentColor; }
  .playfill.lead { width: 44px; height: 44px; margin-top: 2px; }
  .playfill.dim { background: var(--bg-2); color: var(--muted); }
  .playfill.dim:hover { color: var(--ink); }

  .icobtn { background: transparent; border: 0; border-radius: 8px; width: 34px; height: 34px; flex: none;
    display: grid; place-items: center; color: var(--faint); cursor: pointer; }
  .icobtn:hover, .icobtn[aria-expanded="true"] { background: var(--hover); color: var(--ink); }
  .icobtn svg { width: 16px; height: 16px; }

  .pill { display: inline-flex; align-items: center; gap: 7px; border: 0; border-radius: 999px; cursor: pointer;
    font: 500 13px/1 var(--sans); padding: 8px 14px; background: var(--primary); color: var(--accent-ink); white-space: nowrap; }
  .pill:hover { filter: brightness(1.08); }
  .pill svg { width: 13px; height: 13px; flex: none; fill: currentColor; stroke: none; }

  .verb { display: inline-flex; align-items: center; gap: 7px; background: transparent; border: 0; border-radius: 6px;
    padding: 6px 9px; font: 400 13px/1.4 var(--sans); color: var(--faint); cursor: pointer; white-space: nowrap; }
  .verb:hover { background: var(--hover); color: var(--ink); }
  .verb svg { width: 13px; height: 13px; flex: none; }

  /* B · far-right cluster */
  .seatright { display: flex; align-items: center; gap: 22px; }
  .seatright .body { min-width: 0; flex: 1; }
  .seatright .body .foot { margin-top: 10px; }

  /* C · leading seat */
  .lead-row { display: flex; align-items: flex-start; gap: 16px; }
  .lead-row .body { min-width: 0; flex: 1; }

  /* ---- the ⋯ menu ---- */
  .menu { position: fixed; z-index: 40; background: var(--bg); box-shadow: var(--pop); border-radius: 10px;
    padding: 5px; min-width: 176px; display: none; }
  .menu button { display: flex; width: 100%; align-items: center; gap: 9px; padding: 7px 10px; border: 0;
    background: transparent; border-radius: 6px; font: 400 13.5px/1.4 var(--sans); color: var(--ink); cursor: pointer; text-align: left; }
  .menu button:hover { background: var(--hover); }
  .menu svg { width: 14px; height: 14px; flex: none; color: var(--muted); }

  @media (max-width: 600px) { .toprow .bars, .seatright .bars { display: none; } }

  .totals { margin-top: 44px; text-align: center; font-size: 13px; color: var(--faint); font-variant-numeric: tabular-nums; }
</style>

<header class="study">
  <h1>The Play Seat — strip stays</h1>
  <div class="tabs" role="tablist" id="tabs"></div>
  <span class="theme">
    <button type="button" data-set="light" aria-label="Light theme">light</button>
    <button type="button" data-set="dark" aria-label="Dark theme">dark</button>
    <button type="button" data-set="" aria-label="System theme">system</button>
  </span>
</header>
<p class="caption" id="caption"></p>

<section class="screen" id="a" data-name="A · Verbs on the line"
  data-caption="<strong>A · Verbs on the line.</strong> Nothing hidden: today&rsquo;s drawer verbs promoted to a permanent footer row — <em>Run now</em> filled, Pause / All runs / View task quiet words beside it. The strip keeps its seat at the title. Costs a little height; zero discoverability risk."></section>

<section class="screen" id="b" data-name="B · Far-right seat"
  data-caption="<strong>B · Far-right seat.</strong> The strip and a filled play share a right-hand cluster centered on the card — play reads as the card&rsquo;s &ldquo;go.&rdquo; Pause, All runs, and View task fold into the ⋯ (click it — it works)."></section>

<section class="screen" id="c" data-name="C · Leading seat"
  data-caption="<strong>C · Leading seat.</strong> Play leads from the left like a podcast row; the strip stays top-right where it lives today. ⋯ carries Pause / All runs / View task. Paused tasks dim the button to tonal instead of green."></section>

<section class="screen" id="d" data-name="D · Under the strip"
  data-caption="<strong>D · Under the strip.</strong> The strip holds the title line and play + ⋯ sit directly beneath it in the footer — one right-hand rail of week-then-controls, meta on the left. Closest to the live layout: today&rsquo;s drawer just becomes two buttons."></section>

<section class="screen" id="f" data-name="★ F · The pick"
  data-caption="<strong>★ F · The pick.</strong> D&rsquo;s bones with B&rsquo;s alignment: the strip centers on the title-and-description block instead of hanging off the title line, and play + ⋯ keep their footer seat beneath it. Meta on the left; Pause / All runs / View task live in the ⋯."></section>

<section class="screen" id="e" data-name="E · On the meta line"
  data-caption="<strong>E · On the meta line.</strong> The week shrinks to a footer sparkline between the stats and the play, so title and description get the full width. Tightest card of the set; the strip loses some presence. ⋯ carries the rest."></section>

<script>
  /* ------- data: the real workspace, Jul 16 2026 ------- */
  const TASKS = [
    {
      name: "AssessorSearch Subscription Trends",
      desc: "Pulls yesterday's subscription events, compares against the trailing four weeks, and writes a short trend note with any accounts that changed tier.",
      sched: "daily 6:00 am · next in 15h", avg: "$0.42",
      state: { kind: "fail", label: "failed today" }, scheduled: true, enabled: true,
      week: ["ok","ok","ok","ok","ok","ok","fail"], heights: [20,22,21,24,23,20,5]
    },
    {
      name: "AssessorSearch API Usage Analysis",
      desc: "Reads the API logs for the last 24 hours and summarizes call volume, error rates, and the five heaviest endpoints.",
      sched: "daily 7:00 am · next in 16h", avg: "$0.30",
      state: null, scheduled: true, enabled: true,
      week: ["ok","ok","ok","ok","ok","ok","ok"], heights: [18,19,19,21,20,22,20]
    },
    {
      name: "Daily Google Trends Report",
      desc: "Checks search interest for the product's tracked keywords and flags anything moving more than two standard deviations from its monthly baseline.",
      sched: "daily 8:00 am · next in 17h", avg: "$0.13",
      state: { kind: "live", label: "running" }, scheduled: true, enabled: true,
      week: ["ok","ok","ok","ok","ok","ok","live"], heights: [18,20,17,22,18,20,6]
    },
    {
      name: "Weekly Competitor Digest",
      desc: "Visits each competitor's changelog and pricing page, then writes a one-page digest of what shipped and what moved.",
      sched: "paused · weekly Mon 9:00 am", avg: "$1.10",
      state: { kind: "paused", label: "paused" }, scheduled: true, enabled: false,
      week: ["ok","none","none","none","none","none","none"], heights: [22,2,2,2,2,2,2]
    },
    {
      name: "Current Weather Comparison",
      desc: "Compares today's forecast across three providers for the office cities and notes where they disagree.",
      sched: "manual", avg: "$0.04",
      state: null, scheduled: false, enabled: true,
      week: ["none","none","none","ok","none","none","none"], heights: [2,2,2,14,2,2,2]
    }
  ];

  /* lucide outlines */
  const S = 'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
  const svgPlay = `<svg ${S}><polygon points="6 3 20 12 6 21 6 3"/></svg>`;
  const svgPlayFill = `<svg viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"/></svg>`;
  const svgPause = `<svg ${S}><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></svg>`;
  const svgResume = `<svg class="stroked" ${S}><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>`;
  const svgClock = `<svg ${S}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`;
  const svgCoins = `<svg ${S}><circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/><path d="m16.71 13.88.7.71-2.82 2.82"/></svg>`;
  const svgMore = `<svg ${S}><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>`;
  const svgHand = `<svg ${S}><path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2"/><path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>`;
  const svgHist = `<svg ${S}><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>`;
  const svgEye = `<svg ${S}><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>`;

  function stateStat(t) {
    if (!t.state) return "";
    if (t.state.kind === "fail") return `<span class="stat bad">${t.state.label}</span>`;
    if (t.state.kind === "live") return `<span class="stat live"><span class="dot run"></span>${t.state.label}</span>`;
    return "";
  }

  function metaHtml(t) {
    const schedSvg = t.scheduled ? svgClock : svgHand;
    return `<div class="meta">
      ${stateStat(t)}
      <span class="stat">${schedSvg}${t.sched}</span>
      <span class="stat">${svgCoins}${t.avg} avg</span>
    </div>`;
  }

  function barsHtml(t, mini = false) {
    const scale = mini ? 0.7 : 1;
    const bars = t.week.map((s, i) => {
      const h = Math.max(Math.round(t.heights[i] * scale), 2);
      const cls = s === "none" ? "stub" : s === "ok" ? "" : s;
      return `<i class="${cls}" style="height:${h}px"></i>`;
    }).join("");
    return `<div class="bars${mini ? " mini" : ""}" aria-label="Last seven days"><div style="display:contents">${bars}</div></div>`;
  }

  function moreBtn(t, i) {
    return `<button type="button" class="icobtn" data-menu="${i}" aria-haspopup="menu" aria-expanded="false"
      title="More" aria-label="More actions for ${t.name}">${svgMore}</button>`;
  }

  function playFill(t, extra = "") {
    const dim = t.enabled ? "" : " dim";
    return `<button type="button" class="playfill${dim}${extra}" title="Run now" aria-label="Run ${t.name} now">${svgPlayFill}</button>`;
  }

  function playRing(t) {
    return `<button type="button" class="playring" title="Run now" aria-label="Run ${t.name} now">${svgPlay}</button>`;
  }

  function cardShell(t, inner) {
    return `<article class="card${t.enabled ? "" : " paused"}">${inner}</article>`;
  }

  function titleBlock(t) {
    return `<h3 class="title">${t.name}</h3><p class="desc">${t.desc}</p>`;
  }

  function topRow(t) {
    return `<div class="toprow"><div class="id">${titleBlock(t)}</div>${barsHtml(t)}</div>`;
  }

  /* ---- A · Verbs on the line ---- */
  function cardA(t, i) {
    const toggle = !t.scheduled ? "" : t.enabled
      ? `<button type="button" class="verb">${svgPause}<span>Pause</span></button>`
      : `<button type="button" class="verb">${svgResume}<span>Resume</span></button>`;
    return cardShell(t, `
      ${topRow(t)}
      <div class="foot">${metaHtml(t)}</div>
      <div class="foot verbs">
        <div class="acts">
          <button type="button" class="pill">${svgPlayFill}<span>Run now</span></button>
          ${toggle}
          <button type="button" class="verb">${svgHist}<span>All runs</span></button>
          <button type="button" class="verb">${svgEye}<span>View task</span></button>
        </div>
      </div>`);
  }

  /* ---- B · Far-right seat ---- */
  function cardB(t, i) {
    return cardShell(t, `
      <div class="seatright">
        <div class="body">
          ${titleBlock(t)}
          <div class="foot">
            ${metaHtml(t)}
            <span class="spacer"></span>
            ${moreBtn(t, i)}
          </div>
        </div>
        ${barsHtml(t)}
        ${playFill(t)}
      </div>`);
  }

  /* ---- C · Leading seat ---- */
  function cardC(t, i) {
    return cardShell(t, `
      <div class="lead-row">
        ${playFill(t, " lead")}
        <div class="body">
          ${topRow(t)}
          <div class="foot">
            ${metaHtml(t)}
            <span class="spacer"></span>
            ${moreBtn(t, i)}
          </div>
        </div>
      </div>`);
  }

  /* ---- D · Under the strip ---- */
  function cardD(t, i) {
    return cardShell(t, `
      ${topRow(t)}
      <div class="foot">
        ${metaHtml(t)}
        <span class="spacer"></span>
        <div class="acts">
          ${playRing(t)}
          ${moreBtn(t, i)}
        </div>
      </div>`);
  }

  /* ---- F · The pick: D's footer, strip centered on the text block ---- */
  function cardF(t, i) {
    return cardShell(t, `
      <div class="toprow centered"><div class="id">${titleBlock(t)}</div>${barsHtml(t)}</div>
      <div class="foot">
        ${metaHtml(t)}
        <span class="spacer"></span>
        <div class="acts">
          ${playRing(t)}
          ${moreBtn(t, i)}
        </div>
      </div>`);
  }

  /* ---- E · On the meta line ---- */
  function cardE(t, i) {
    return cardShell(t, `
      ${titleBlock(t)}
      <div class="foot">
        ${metaHtml(t)}
        <span class="spacer"></span>
        ${barsHtml(t, true)}
        <div class="acts">
          ${playRing(t)}
          ${moreBtn(t, i)}
        </div>
      </div>`);
  }

  /* ------- assembly ------- */
  const RENDER = { a: cardA, b: cardB, c: cardC, d: cardD, e: cardE, f: cardF };

  function sheetHtml(render) {
    return `<div class="sheet">
      <div class="pagehead"><h2>Tasks</h2><span>5 tasks</span></div>
      ${TASKS.map(render).join("")}
      <p class="totals">This program: 41 runs · $9.87 · 2.1M tokens in the last 30 days</p>
    </div>`;
  }

  const screens = [...document.querySelectorAll(".screen")];
  const tabsEl = document.getElementById("tabs");
  const captionEl = document.getElementById("caption");

  screens.forEach((screen, index) => {
    screen.innerHTML = sheetHtml(RENDER[screen.id]);
    const button = document.createElement("button");
    button.type = "button";
    button.setAttribute("role", "tab");
    button.innerHTML = `<span class="k">${index + 1}</span>${screen.dataset.name}`;
    button.addEventListener("click", () => select(index));
    tabsEl.appendChild(button);
  });

  function select(index) {
    screens.forEach((screen, i) => screen.classList.toggle("active", i === index));
    [...tabsEl.children].forEach((tab, i) => tab.setAttribute("aria-selected", String(i === index)));
    captionEl.innerHTML = screens[index].dataset.caption;
    closeMenu();
  }

  document.addEventListener("keydown", (event) => {
    if (event.target.closest("input, textarea")) return;
    if (event.key === "Escape") return closeMenu();
    const index = Number(event.key) - 1;
    if (index >= 0 && index < screens.length) select(index);
  });

  document.querySelectorAll(".theme button").forEach((button) => {
    button.addEventListener("click", () => {
      const value = button.dataset.set;
      if (value) document.documentElement.dataset.theme = value;
      else delete document.documentElement.dataset.theme;
    });
  });

  /* ------- the ⋯ menu: Pause/Resume · All runs · View task ------- */
  const menu = document.createElement("div");
  menu.className = "menu";
  menu.setAttribute("role", "menu");
  document.body.appendChild(menu);
  let menuAnchor = null;

  function closeMenu() {
    menu.style.display = "none";
    if (menuAnchor) menuAnchor.setAttribute("aria-expanded", "false");
    menuAnchor = null;
  }

  function openMenu(anchor, t) {
    const toggle = !t.scheduled ? "" : t.enabled
      ? `<button type="button" role="menuitem">${svgPause}<span>Pause schedule</span></button>`
      : `<button type="button" role="menuitem">${svgResume}<span>Resume schedule</span></button>`;
    menu.innerHTML = `${toggle}
      <button type="button" role="menuitem">${svgHist}<span>All runs</span></button>
      <button type="button" role="menuitem">${svgEye}<span>View task</span></button>`;
    menu.style.display = "block";
    const box = anchor.getBoundingClientRect();
    const w = menu.offsetWidth;
    menu.style.left = `${Math.min(box.right - w, window.innerWidth - w - 8)}px`;
    menu.style.top = `${box.bottom + 6}px`;
    menuAnchor = anchor;
    anchor.setAttribute("aria-expanded", "true");
  }

  document.addEventListener("click", (event) => {
    const anchor = event.target.closest("[data-menu]");
    if (anchor) {
      if (menuAnchor === anchor) return closeMenu();
      closeMenu();
      return openMenu(anchor, TASKS[Number(anchor.dataset.menu)]);
    }
    closeMenu();
  });
  window.addEventListener("scroll", closeMenu, true);

  select(0);
</script>
