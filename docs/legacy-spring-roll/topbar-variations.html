<meta charset="utf-8">
<title>The Top Bar — five hats</title>
<style>
  /* Spring Roll tokens (assets/css/app.css, rice paper 2026-07-14) */
  :root {
    --bg: #fdfcfa; --bg-2: #f4f3ee; --ink: #3a382f; --muted: #7d7b74; --faint: #aeaca4;
    --border-strong: #d8d6d0; --hover: rgb(58 56 47 / 0.06);
    --accent: #3f8f63; --accent-text: #357953; --ok: #3f8f63; --run: #d98232; --fail: #c65346;
    --sans: "Inter", system-ui, -apple-system, sans-serif;
    --pop: 0 1px 2px rgb(15 15 15 / 0.05), 0 5px 18px rgb(15 15 15 / 0.09);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e1e; --bg-2: #262626; --ink: #e6e4e0; --muted: #9b9a96; --faint: #6f6e6a;
      --border-strong: #474744; --hover: rgb(255 255 255 / 0.055);
      --accent: #3f8f63; --accent-text: #7cc296; --ok: #5bab80; --run: #e0934f; --fail: #e06a58;
      --pop: 0 1px 2px rgb(0 0 0 / 0.3), 0 5px 18px rgb(0 0 0 / 0.45);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1e1e1e; --bg-2: #262626; --ink: #e6e4e0; --muted: #9b9a96; --faint: #6f6e6a;
    --border-strong: #474744; --hover: rgb(255 255 255 / 0.055);
    --accent: #3f8f63; --accent-text: #7cc296; --ok: #5bab80; --run: #e0934f; --fail: #e06a58;
    --pop: 0 1px 2px rgb(0 0 0 / 0.3), 0 5px 18px rgb(0 0 0 / 0.45);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #fdfcfa; --bg-2: #f4f3ee; --ink: #3a382f; --muted: #7d7b74; --faint: #aeaca4;
    --border-strong: #d8d6d0; --hover: rgb(58 56 47 / 0.06);
    --accent: #3f8f63; --accent-text: #357953; --ok: #3f8f63; --run: #d98232; --fail: #c65346;
    --pop: 0 1px 2px rgb(15 15 15 / 0.05), 0 5px 18px rgb(15 15 15 / 0.09);
    color-scheme: light;
  }

  html { -webkit-font-smoothing: antialiased; }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.65; margin: 0; }

  .study { position: sticky; top: 0; z-index: 40; background: var(--bg); padding: 14px 20px 10px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
  .study h1 { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 auto 0 0; }
  .tabs { display: flex; flex-wrap: wrap; gap: 2px; background: var(--bg-2); border-radius: 8px; padding: 3px; }
  .tabs button { font: 500 13px/1.4 var(--sans); color: var(--muted); background: transparent; border: 0; border-radius: 6px; padding: 4px 11px; cursor: pointer; }
  .tabs button:hover { color: var(--ink); }
  .tabs button[aria-selected="true"] { background: var(--bg); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgb(15 15 15 / 0.06); }
  .tabs .k { color: var(--faint); font-weight: 400; margin-right: 5px; }
  .theme button { font: 500 12px/1 var(--sans); background: transparent; color: var(--faint); border: 0; border-radius: 6px; padding: 6px 8px; cursor: pointer; }
  .theme button:hover { color: var(--ink); }
  .tabs button:focus-visible, .theme button:focus-visible, .glyph:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .caption { max-width: 760px; margin: 4px auto 0; padding: 0 24px; text-align: center; font-size: 14px; color: var(--muted); }
  .caption strong { color: var(--ink); }

  .screen { display: none; }
  .screen.active { display: block; }

  /* shipped chrome */
  .glyph { display: inline-flex; width: 38px; height: 38px; align-items: center; justify-content: center;
    border-radius: 8px; background: none; border: 0; color: var(--muted); cursor: pointer; text-decoration: none; position: relative; }
  .glyph:hover { background: var(--hover); color: var(--ink); }
  .glyph svg { width: 19px; height: 19px; }

  .bar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; }
  .bar .mark { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink); text-decoration: none; }
  .bar .end { margin-left: auto; display: flex; align-items: center; gap: 2px; }

  .shell { display: flex; align-items: flex-start; }
  .rail { flex: none; width: 200px; padding: 16px 12px; position: sticky; top: 0; }
  .rail nav { display: flex; flex-direction: column; gap: 4px; }
  .rail a { display: flex; align-items: center; gap: 14px; padding: 10px; border-radius: 8px;
    font-size: 14px; font-weight: 500; color: var(--muted); text-decoration: none; white-space: nowrap; }
  .rail a svg { width: 18px; height: 18px; flex: none; color: var(--faint); }
  .rail a:hover { background: var(--hover); color: var(--ink); }
  .rail a.active { color: var(--ink); background: var(--hover); }
  .rail a.active svg { color: var(--accent-text); }

  /* command field (v2) */
  .cmd { display: flex; flex: 1; max-width: 430px; align-items: center; gap: 10px; margin-left: 22px;
    padding: 8px 14px; border-radius: 999px; background: var(--bg-2); color: var(--faint);
    font-size: 13.5px; border: 0; cursor: text; font-family: var(--sans); }
  .cmd:hover { color: var(--muted); }
  .cmd svg { width: 15px; height: 15px; flex: none; }
  .cmd .k { margin-left: auto; font-size: 11.5px; }

  /* live pulse chip (v4) */
  .pulse { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 999px;
    background: none; border: 0; cursor: pointer; font: 500 13px/1 var(--sans); color: var(--muted); }
  .pulse:hover { background: var(--hover); color: var(--ink); }
  .pulse .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--run); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) { .pulse .dot { animation: none; } }

  .spark svg { color: var(--accent-text); }

  /* the tasks page beneath */
  .sheet { max-width: 896px; margin: 0 auto; padding: 18px 32px 96px; }
  .pagerow { display: flex; justify-content: flex-end; gap: 2px; margin: 0 -8px 4px 0; }
  .pagerow .glyph { width: 32px; height: 32px; }
  .pagerow .glyph svg { width: 17px; height: 17px; }
  .chapter { margin: 22px 0 2px; font-size: 16px; font-weight: 500; color: var(--faint); }
  .trow { display: flex; align-items: flex-start; gap: 18px; margin: 0 -12px; padding: 9px 12px; border-radius: 10px; }
  .trow:hover { background: var(--hover); }
  .trow .id { min-width: 0; flex: 1; }
  .trow .name { font-size: 16px; font-weight: 500; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trow .sched { font-size: 13px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .trow .sched .bad { color: var(--fail); }
  .bars { display: flex; align-items: flex-end; gap: 4px; height: 26px; margin-top: 1px; }
  .bars i { width: 14px; border-radius: 2px 2px 0 0; background: var(--ok); }
  .bars i.fail { background: var(--fail); }
  .bars i.stub { background: var(--border-strong); opacity: 0.55; border-radius: 1px; height: 2px !important; }

  /* palette overlay (v2 + v5, summoned) */
  .pal-scrim { position: fixed; inset: 0; z-index: 50; background: rgb(15 15 15 / 0.18); display: none; }
  .palette { position: fixed; z-index: 51; top: 14vh; left: 50%; transform: translateX(-50%);
    width: min(560px, 92vw); border-radius: 14px; background: var(--bg); box-shadow: var(--pop);
    padding: 8px; display: none; }
  body.pal-open .pal-scrim, body.pal-open .palette { display: block; }
  .palette .in { display: flex; align-items: center; gap: 11px; padding: 11px 12px; font-size: 15px; color: var(--faint); }
  .palette .in svg { width: 17px; height: 17px; }
  .palette .in .caret { color: var(--accent-text); animation: pulse 1.1s step-end infinite; }
  .palette .group { padding: 7px 12px 3px; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--faint); }
  .palette .row { display: flex; align-items: center; gap: 11px; padding: 9px 12px; border-radius: 8px;
    font-size: 14px; color: var(--muted); cursor: pointer; }
  .palette .row:hover, .palette .row.sel { background: var(--hover); color: var(--ink); }
  .palette .row svg { width: 15px; height: 15px; color: var(--faint); }
  .palette .row .k { margin-left: auto; font-size: 11.5px; color: var(--faint); }
</style>

<header class="study">
  <h1>The Top Bar — five hats</h1>
  <div class="tabs" role="tablist" id="tabs"></div>
  <span class="theme">
    <button type="button" data-set="light">light</button>
    <button type="button" data-set="dark">dark</button>
    <button type="button" data-set="">system</button>
  </span>
</header>
<p class="caption" id="caption"></p>

<section class="screen" id="v1" data-name="Glyph row"
  data-caption="<strong>Glyph row.</strong> The straightforward one: ⌕ and ＋ move up into the bar&rsquo;s right end and become global — search from anywhere, new task from anywhere — and the tasks page&rsquo;s own corner glyphs retire. AI isn&rsquo;t seated yet; when it arrives it enters through search. Filtering stays on the page: a filter describes the list it stands next to, not the app."></section>

<section class="screen" id="v2" data-name="Command line"
  data-caption="<strong>Command line.</strong> One door for everything: a quiet pill — <em>Search or ask…</em> — sits in the bar (<em>click it</em>). Typing searches; asking runs the AI; new task is the palette&rsquo;s first verb. This is the strongest AI answer — no new chrome when it arrives, the field just gets smarter. The cost: a visible input in the chrome of every page, and the pill is the loudest thing on screen."></section>

<section class="screen" id="v3" data-name="The spark"
  data-caption="<strong>The spark.</strong> AI gets an explicit seat: ✦ in accent green at the bar&rsquo;s right end, beside ⌕ and ＋. Honest about what&rsquo;s coming and where it will live — press it and an ask-anything surface opens (voice later). The risk: a third glyph is a header growing back, and an accent-colored one at rest breaks the &lsquo;color only for meaning&rsquo; rule before the feature even exists."></section>

<section class="screen" id="v4" data-name="Heartbeat"
  data-caption="<strong>Heartbeat.</strong> The bar carries the one piece of global state worth glancing at: a pulsing amber chip — <em>1 running</em> — whenever something is live, a door straight to that run. Quiet when idle (the chip simply isn&rsquo;t there). ⌕ and ＋ keep the right end. This is the &lsquo;anything else?&rsquo; answer: not filters, not stats — just whether the kitchen is cooking."></section>

<section class="screen" id="v5" data-name="★ One door"
  data-caption="<strong>★ One door.</strong> The subtractive combination: the bar holds ☰, the wordmark, the heartbeat chip when live, and exactly one glyph — ⌕ (<em>click it</em>). The palette behind it is search, new task, AND the future AI in one surface (⌘K for keyboard people; the mic joins the palette when voice ships — the parked plan). ＋ stays on the tasks page where making tasks happens. The header never grows again."></section>

<!-- palette overlay -->
<div class="pal-scrim" onclick="document.body.classList.remove('pal-open')"></div>
<div class="palette" role="dialog" aria-label="Command palette">
  <div class="in" id="pal-in"></div>
  <div class="group">actions</div>
  <div class="row sel" id="pal-new"></div>
  <div class="group">go to</div>
  <div id="pal-rows"></div>
</div>

<script>
  const icons = {
    burger: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg>',
    search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>',
    plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>',
    spark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.7a2 2 0 0 0 1.3 1.3L21 12l-5.8 1.9a2 2 0 0 0-1.3 1.3L12 21l-1.9-5.8a2 2 0 0 0-1.3-1.3L3 12l5.8-2a2 2 0 0 0 1.3-1.2L12 3z"/></svg>',
    tasks: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 7 2 2 4-4"/><path d="m3 17 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></svg>',
    runs: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>',
    connect: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22v-5"/><path d="M9 8V2"/><path d="M15 8V2"/><path d="M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"/></svg>',
    integrations: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="14" y="3" rx="1"/><path d="M10 21V8a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-5a1 1 0 0 0-1-1H3"/></svg>',
    settings: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>'
  };

  document.getElementById("pal-in").innerHTML =
    `${icons.search}<span>Search tasks and runs, or ask anything…</span><span class="caret">▍</span>`;
  document.getElementById("pal-new").innerHTML =
    `${icons.plus}<span>New task</span><span class="k">N</span>`;
  document.getElementById("pal-rows").innerHTML = [
    [icons.tasks, "tasks"], [icons.runs, "runs"], [icons.connect, "connect"],
    [icons.integrations, "integrations"], [icons.settings, "settings"]
  ].map(([icon, word]) => `<div class="row">${icon}<span>${word}</span></div>`).join("");

  const NAV = [["tasks", true], ["runs", false], ["connect", false], ["integrations", false], ["settings", false]];
  const railHtml = `<div class="rail"><nav>${NAV.map(([w, a]) =>
    `<a href="#" onclick="return false" class="${a ? "active" : ""}">${icons[w]}<span>${w}</span></a>`).join("")}</nav></div>`;

  const ROWS = [
    ["analytics", [
      ["AssessorSearch Subscription Trends", '<span class="bad">failed today</span> · daily 6:00 AM · next in 14h', [18,20,20,22,21,19,-1]],
      ["AssessorSearch API Usage Analysis", "daily 7:00 AM · next in 15h", [20,21,21,23,22,25,22]]
    ]],
    ["research", [
      ["Daily Google Trends Report", "daily 8:00 AM · next in 16h", [21,23,19,25,21,23,24]],
      ["Current Weather Comparison", "manual", [0,0,0,26,0,0,0]]
    ]]
  ];
  function tasksSheet(showPageGlyphs) {
    const chapters = ROWS.map(([label, rows]) => `<div class="chapter">${label}</div>` +
      rows.map(([name, sched, week]) => `<div class="trow">
        <div class="id"><div class="name">${name}</div><div class="sched">${sched}</div></div>
        <div class="bars">${week.map(h =>
          h === 0 ? '<i class="stub"></i>' : h === -1 ? '<i class="fail" style="height:4px"></i>' : `<i style="height:${h}px"></i>`
        ).join("")}</div>
      </div>`).join("")
    ).join("");
    const pageGlyphs = showPageGlyphs
      ? `<div class="pagerow"><button class="glyph" aria-label="Search tasks">${icons.search}</button><button class="glyph" aria-label="New task">${icons.plus}</button></div>`
      : "";
    return `<div class="sheet">${pageGlyphs}${chapters}</div>`;
  }

  const g = (icon, label, extra = "", cls = "glyph") =>
    `<button type="button" class="${cls}" aria-label="${label}" ${extra}>${icon}</button>`;
  const openPal = `onclick="document.body.classList.add('pal-open')"`;
  const bar = (endHtml, midHtml = "") => `<div class="bar">
    ${g(icons.burger, "Collapse navigation")}
    <a class="mark" href="#" onclick="return false">spring roll</a>
    ${midHtml}
    <span class="end">${endHtml}</span>
  </div>`;
  const pulseChip = `<button type="button" class="pulse" title="Daily Google Trends Report — 2nd pass">
    <span class="dot"></span> 1 running
  </button>`;

  const shellWith = (barHtml, showPageGlyphs) =>
    `${barHtml}<div class="shell">${railHtml}<div style="flex:1;min-width:0">${tasksSheet(showPageGlyphs)}</div></div>`;

  document.getElementById("v1").innerHTML = shellWith(
    bar(g(icons.search, "Search") + g(icons.plus, "New task")), false);

  document.getElementById("v2").innerHTML = shellWith(
    bar(g(icons.plus, "New task"),
      `<button type="button" class="cmd" ${openPal}>${icons.search}<span>Search or ask…</span><span class="k">⌘K</span></button>`),
    false);

  document.getElementById("v3").innerHTML = shellWith(
    bar(g(icons.search, "Search") + g(icons.plus, "New task") + g(icons.spark, "Ask AI", "", "glyph spark")), false);

  document.getElementById("v4").innerHTML = shellWith(
    bar(pulseChip + g(icons.search, "Search") + g(icons.plus, "New task")), false);

  document.getElementById("v5").innerHTML = shellWith(
    bar(pulseChip + g(icons.search, "Search or ask (⌘K)", openPal)), true);

  /* ------- study chrome ------- */
  const screens = [...document.querySelectorAll(".screen")];
  const tabs = document.getElementById("tabs");
  const caption = document.getElementById("caption");

  screens.forEach((s, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.role = "tab";
    b.innerHTML = `<span class="k">${i + 1}</span>${s.dataset.name}`;
    b.addEventListener("click", () => select(i));
    tabs.appendChild(b);
  });

  function select(i) {
    screens.forEach((s, j) => s.classList.toggle("active", i === j));
    [...tabs.children].forEach((b, j) => b.setAttribute("aria-selected", i === j));
    caption.innerHTML = screens[i].dataset.caption;
    document.body.classList.remove("pal-open");
  }
  select(4);

  document.addEventListener("keydown", e => {
    if (e.key === "Escape") document.body.classList.remove("pal-open");
    const n = Number(e.key);
    if (n >= 1 && n <= screens.length && !e.metaKey && !e.ctrlKey) select(n - 1);
  });

  document.querySelectorAll(".theme button").forEach(b => {
    b.addEventListener("click", () => {
      if (b.dataset.set) document.documentElement.dataset.theme = b.dataset.set;
      else delete document.documentElement.dataset.theme;
    });
  });
</script>
