<meta charset="utf-8">
<title>The Cost Strip — four calmings</title>
<style>
  /* Spring Roll tokens (assets/css/app.css, rice paper 2026-07-14) */
  :root {
    --bg: #fdfcfa;
    --bg-2: #f4f3ee;
    --ink: #3a382f;
    --muted: #7d7b74;
    --faint: #aeaca4;
    --border-strong: #d8d6d0;
    --hover: rgb(58 56 47 / 0.06);
    --accent: #3f8f63;
    --accent-text: #357953;
    --ok: #3f8f63;
    --run: #d98232;
    --fail: #c65346;
    --spend: #a96528;
    --sans: "Inter", system-ui, -apple-system, sans-serif;
    --pop: 0 4px 16px rgb(15 15 15 / 0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e1e; --bg-2: #262626; --ink: #e6e4e0; --muted: #9b9a96; --faint: #6f6e6a;
      --border-strong: #474744; --hover: rgb(255 255 255 / 0.055);
      --accent: #3f8f63; --accent-text: #7cc296; --ok: #5bab80; --run: #e0934f; --fail: #e06a58; --spend: #c98f54;
      --pop: 0 4px 16px rgb(0 0 0 / 0.45);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1e1e1e; --bg-2: #262626; --ink: #e6e4e0; --muted: #9b9a96; --faint: #6f6e6a;
    --border-strong: #474744; --hover: rgb(255 255 255 / 0.055);
    --accent: #3f8f63; --accent-text: #7cc296; --ok: #5bab80; --run: #e0934f; --fail: #e06a58; --spend: #c98f54;
    --pop: 0 4px 16px rgb(0 0 0 / 0.45);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #fdfcfa; --bg-2: #f4f3ee; --ink: #3a382f; --muted: #7d7b74; --faint: #aeaca4;
    --border-strong: #d8d6d0; --hover: rgb(58 56 47 / 0.06);
    --accent: #3f8f63; --accent-text: #357953; --ok: #3f8f63; --run: #d98232; --fail: #c65346; --spend: #a96528;
    --pop: 0 4px 16px rgb(15 15 15 / 0.12);
    color-scheme: light;
  }

  html { -webkit-font-smoothing: antialiased; }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.65; margin: 0; }

  .study { position: sticky; top: 0; z-index: 10; background: var(--bg); padding: 14px 20px 10px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
  .study h1 { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 auto 0 0; }
  .tabs { display: flex; flex-wrap: wrap; gap: 2px; background: var(--bg-2); border-radius: 8px; padding: 3px; }
  .tabs button { font: 500 13px/1.4 var(--sans); color: var(--muted); background: transparent; border: 0; border-radius: 6px; padding: 4px 11px; cursor: pointer; }
  .tabs button:hover { color: var(--ink); }
  .tabs button[aria-selected="true"] { background: var(--bg); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgb(15 15 15 / 0.06); }
  .tabs button:focus-visible, .theme button:focus-visible, [tabindex="0"]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tabs .k { color: var(--faint); font-weight: 400; margin-right: 5px; }
  .theme button { font: 500 12px/1 var(--sans); background: transparent; color: var(--faint); border: 0; border-radius: 6px; padding: 6px 8px; cursor: pointer; }
  .theme button:hover { color: var(--ink); }

  .caption { max-width: 720px; margin: 4px auto 0; padding: 0 24px; text-align: center; font-size: 14px; color: var(--muted); }
  .caption strong { color: var(--ink); font-weight: 600; }

  .screen { display: none; padding: 28px 24px 96px; }
  .screen.active { display: block; }

  .masthead { display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; margin-bottom: 40px; }
  .masthead a { font-size: 12px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; text-decoration: none;
    color: var(--faint); padding: 4px 8px; border-radius: 6px; white-space: nowrap; }
  .masthead a:hover { color: var(--muted); }
  .masthead a.active { color: var(--ink); font-weight: 600; }

  .sheet { max-width: 720px; margin: 0 auto; }

  .glyphs { display: flex; justify-content: flex-end; gap: 2px; margin: 0 -8px 4px 0; }
  .glyphs button { background: transparent; border: 0; border-radius: 6px; width: 32px; height: 32px;
    display: grid; place-items: center; color: var(--faint); cursor: pointer; }
  .glyphs button:hover { background: var(--hover); color: var(--ink); }
  .glyphs svg { width: 18px; height: 18px; }

  /* ---- the list: TWO sizes (16 / 13), TWO inks (ink / faint) ----
     Status colors stay semantic only: red = failure, amber = live, green = the bars. */
  .chapter { margin: 28px 0 2px; font-size: 16px; font-weight: 500; color: var(--faint); }

  .card { margin: 0 -12px; border-radius: 10px; }
  .card.open { background: var(--hover); }
  .card:not(.open):hover { background: var(--hover); }
  .prow { display: flex; align-items: center; gap: 18px; padding: 11px 12px; cursor: pointer; border-radius: 10px; }
  .prow .id { min-width: 0; flex: 1; }
  .prow .name { font-size: 16px; font-weight: 500; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .prow .sched { font-size: 13px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .prow .sched .bad { color: var(--fail); }
  .prow .sched .live { color: var(--run); }

  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .dot.ok { background: var(--ok); }
  .dot.fail { background: var(--fail); }
  .dot.run { background: var(--run); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) { .dot.run, .bars i.live { animation: none; } }

  /* the week strip — one slot per calendar day, last seven */
  .strip { flex: none; position: relative; }
  .bars { display: flex; align-items: flex-end; gap: 4px; height: 26px; }
  .bars i { width: 14px; border-radius: 2px 2px 0 0; background: var(--ok); position: relative; }
  .bars i.fail { background: var(--fail); }
  .bars i.live { background: var(--run); animation: pulse 1.6s ease-in-out infinite; }
  .bars i.stub { background: var(--border-strong); opacity: 0.55; border-radius: 1px; }
  .bars i::before { content: ""; position: absolute; left: -2px; right: -2px; top: -26px; bottom: 0; }
  .bars i:hover:not(.stub) { filter: brightness(1.12); cursor: pointer; }

  /* squared: the bars share the title's line — bottoms on its baseline */
  .squared .prow { align-items: flex-start; }
  .squared .strip { margin-top: 1px; }

  /* the shared hover tip */
  .tip { position: fixed; z-index: 30; pointer-events: none; background: var(--bg-2); box-shadow: var(--pop);
    border-radius: 8px; padding: 6px 10px; font-size: 13px; line-height: 1.5; color: var(--faint);
    font-variant-numeric: tabular-nums; white-space: nowrap; transform: translate(-50%, calc(-100% - 10px)); display: none; }
  .tip b { color: var(--ink); font-weight: 500; }
  .tip .bad { color: var(--fail); }
  .tip .live { color: var(--run); }

  /* expansion (drawer) */
  .expand { padding: 2px 14px 14px 14px; }
  .receipt { display: flex; align-items: baseline; gap: 12px; padding: 4px 10px; margin: 0 -10px 2px; border-radius: 6px;
    font-size: 13px; color: var(--faint); cursor: pointer; font-variant-numeric: tabular-nums; }
  .receipt:hover { background: var(--hover); }
  .receipt:hover .when { color: var(--accent-text); }
  .receipt .dot { align-self: center; }
  .receipt .when { color: var(--ink); }
  .receipt .note { color: var(--fail); }
  .receipt .note.live { color: var(--run); }
  .receipt .go { margin-left: auto; }
  .squared .receipt .tail { margin-left: auto; }
  .expand .foot { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 4px; margin-top: 4px; }
  .action { display: inline-flex; align-items: center; gap: 7px; background: transparent; border: 0; border-radius: 6px;
    padding: 5px 9px; font: 400 13px/1.4 var(--sans); color: var(--faint); cursor: pointer; text-decoration: none; }
  .action:hover { background: var(--hover); color: var(--ink); }
  .action svg { width: 13px; height: 13px; flex: none; }

  .ghost { display: flex; justify-content: center; padding: 9px 12px; margin: 6px -12px 0; border-radius: 10px;
    font-size: 16px; font-weight: 500; color: var(--faint); cursor: pointer; opacity: 0; transition: opacity 0.15s; }
  .list:hover .ghost, .ghost:focus-visible { opacity: 1; }
  .ghost:hover { background: var(--hover); color: var(--ink); }

  .totals { margin-top: 44px; text-align: center; font-size: 13px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .hint { margin-top: 36px; text-align: center; font-size: 13px; color: var(--faint); }

  @media (max-width: 620px) { .prow .strip { display: none; } }
</style>

<header class="study">
  <h1>The Cost Strip — polish pass</h1>
  <div class="tabs" role="tablist" id="tabs"></div>
  <span class="theme">
    <button type="button" data-set="light" aria-label="Light theme">light</button>
    <button type="button" data-set="dark" aria-label="Dark theme">dark</button>
    <button type="button" data-set="" aria-label="System theme">system</button>
  </span>
</header>
<p class="caption" id="caption"></p>

<section class="screen" id="p1" data-name="Two sizes, two inks"
  data-caption="<strong>Two sizes, two inks.</strong> Same design, type flattened: <em>16px</em> for names and chapter headings, <em>13px</em> for every other word on the sheet — meta, receipt, actions, totals, hint. Text colors reduced to ink and faint; the avg-$ stat loses its highlight and the sentence reads one color end to end. Red and amber survive only as status."></section>

<section class="screen" id="p2" data-name="Less said"
  data-caption="<strong>Less said.</strong> The content diet on top of the flat type: action icons gone (four quiet words), the &ldquo;last run&rdquo; label and &ldquo;open →&rdquo; gone (a dot, a date, and a hover already say it), and the amber &ldquo;running&rdquo; word gone — the pulsing bar was already saying it twice. What remains is only what has nowhere else to live."></section>

<section class="screen" id="p3" data-name="★ Squared away"
  data-caption="<strong>★ Squared away.</strong> The alignment pass on top of both: the bars sit on the title&rsquo;s baseline and stand exactly one line tall, so the strip stops floating mid-row; the receipt&rsquo;s numbers push right to lock under the bars&rsquo; edge. Every element sits on someone else&rsquo;s line instead of hovering between them."></section>

<script>
  /* ------- data: the real workspace, week of Jul 9–15 2026 ------- */
  const TASKS = [
    {
      group: "analytics", name: "AssessorSearch Subscription Trends",
      sched: "daily 6:00 am · next in 15h", model: "sonnet-4-5", avg: "$0.42",
      week: [
        { d: "Thu Jul 9", t: "6:02 am", c: 0.39, dur: "4m 20s", s: "ok" },
        { d: "Fri Jul 10", t: "6:03 am", c: 0.43, dur: "4m 41s", s: "ok" },
        { d: "Sat Jul 11", t: "6:03 am", c: 0.42, dur: "4m 38s", s: "ok" },
        { d: "Sun Jul 12", t: "6:02 am", c: 0.47, dur: "5m 02s", s: "ok" },
        { d: "Mon Jul 13", t: "6:02 am", c: 0.44, dur: "4m 51s", s: "ok" },
        { d: "Tue Jul 14", t: "6:03 am", c: 0.40, dur: "4m 40s", s: "ok" },
        { d: "Today", t: "6:01 am", c: 0.05, dur: "1m 12s", s: "fail" }
      ],
      state: { kind: "fail", label: "failed today" },
      receipt: { s: "fail", when: "today, 6:01 am", note: "failed", dur: "1m 12s", cost: "$0.05" },
      open: true
    },
    {
      group: "analytics", name: "AssessorSearch API Usage Analysis",
      sched: "daily 7:00 am · next in 16h", model: "sonnet-4-5", avg: "$0.30",
      week: [
        { d: "Thu Jul 9", t: "7:03 am", c: 0.27, dur: "3m 28s", s: "ok" },
        { d: "Fri Jul 10", t: "7:04 am", c: 0.28, dur: "3m 35s", s: "ok" },
        { d: "Sat Jul 11", t: "7:03 am", c: 0.28, dur: "3m 31s", s: "ok" },
        { d: "Sun Jul 12", t: "7:04 am", c: 0.31, dur: "3m 50s", s: "ok" },
        { d: "Mon Jul 13", t: "7:03 am", c: 0.29, dur: "3m 44s", s: "ok" },
        { d: "Tue Jul 14", t: "7:05 am", c: 0.33, dur: "4m 02s", s: "ok" },
        { d: "Today", t: "7:04 am", c: 0.30, dur: "3m 41s", s: "ok" }
      ],
      state: null,
      receipt: { s: "ok", when: "today, 7:04 am", dur: "3m 41s", cost: "$0.30" }
    },
    {
      group: "research", name: "Daily Google Trends Report",
      sched: "daily 8:00 am · next in 17h", model: "haiku-4-5", avg: "$0.13",
      week: [
        { d: "Thu Jul 9", t: "8:02 am", c: 0.12, dur: "2m 20s", s: "ok" },
        { d: "Fri Jul 10", t: "8:02 am", c: 0.13, dur: "2m 31s", s: "ok" },
        { d: "Sat Jul 11", t: "8:01 am", c: 0.11, dur: "2m 12s", s: "ok" },
        { d: "Sun Jul 12", t: "8:02 am", c: 0.14, dur: "2m 44s", s: "ok" },
        { d: "Mon Jul 13", t: "8:02 am", c: 0.12, dur: "2m 25s", s: "ok" },
        { d: "Tue Jul 14", t: "8:01 am", c: 0.13, dur: "2m 30s", s: "ok" },
        { d: "Today", t: "8:00 am", s: "live" }
      ],
      state: { kind: "live", label: "running" },
      receipt: { s: "run", when: "today, 8:00 am", note: "running", live: true }
    },
    {
      group: "research", name: "Current Weather Comparison",
      sched: "manual", model: "haiku-4-5", avg: "$0.04",
      week: [
        { d: "Thu Jul 9", s: "none" }, { d: "Fri Jul 10", s: "none" }, { d: "Sat Jul 11", s: "none" },
        { d: "Sun Jul 12", t: "2:14 pm", c: 0.05, dur: "1m 05s", s: "ok" },
        { d: "Mon Jul 13", s: "none" }, { d: "Tue Jul 14", s: "none" }, { d: "Today", s: "none" }
      ],
      state: null,
      receipt: { s: "ok", when: "Jul 12, 2:14 pm", dur: "1m 05s", cost: "$0.05" }
    }
  ];

  const svgSearch = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>';
  const svgPlus = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>';
  const svgPlay = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></svg>';
  const svgPause = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></svg>';
  const svgHist = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/></svg>';
  const svgEye = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>';

  function mastheadHtml() {
    return `<nav class="masthead" aria-label="Main navigation">
      <a href="#" onclick="return false" class="active">tasks</a><a href="#" onclick="return false">runs</a><a href="#" onclick="return false">connect</a><a href="#" onclick="return false">integrations</a><a href="#" onclick="return false">settings</a>
    </nav>`;
  }

  function glyphsHtml() {
    return `<div class="glyphs">
      <button type="button" title="Search tasks" aria-label="Search tasks">${svgSearch}</button>
      <button type="button" title="New task" aria-label="New task">${svgPlus}</button>
    </div>`;
  }

  function barHeight(c, peak) {
    if (c == null || peak <= 0) return 3;
    return Math.max(3, Math.round((c / peak) * 26));
  }

  function tipHtml(r) {
    if (r.s === "none") return `<b>${r.d}</b> · no run`;
    if (r.s === "live") return `<b>${r.d}, ${r.t}</b> · <span class="live">running</span>`;
    const bad = r.s === "fail" ? ` · <span class="bad">failed</span>` : "";
    return `<b>${r.d}, ${r.t}</b>${bad} · $${r.c.toFixed(2)} · ${r.dur}`;
  }

  function barsHtml(week) {
    const peak = Math.max(0, ...week.map(r => r.c || 0));
    const bars = week.map(r => {
      const tip = ` data-tip="${tipHtml(r).replace(/"/g, "&quot;")}"`;
      if (r.s === "none") return `<i class="stub" style="height:2px"${tip}></i>`;
      if (r.s === "live") return `<i class="live" style="height:6px"${tip}></i>`;
      const klass = r.s === "fail" ? ' class="fail"' : "";
      return `<i${klass} style="height:${barHeight(r.c, peak)}px"${tip}></i>`;
    }).join("");
    return `<div class="strip"><div class="bars" aria-hidden="true">${bars}</div></div>`;
  }

  function receiptHtml(t, v) {
    const r = t.receipt;
    const note = r.note ? `<span class="note${r.live ? " live" : ""}">${r.note}</span>` : "";
    const tailBits = [r.dur, r.cost].filter(Boolean).join(" · ");
    return `<div class="receipt">
      <span class="dot ${r.s}"></span>
      ${v.lbl ? `<span>last run</span>` : ""}
      <span class="when">${r.when}</span>
      ${note}
      ${tailBits ? `<span class="tail">${tailBits}</span>` : ""}
      ${v.lbl ? `<span class="go">open →</span>` : ""}
    </div>`;
  }

  function actionHtml(icon, word, v) {
    return `<button type="button" class="action">${v.icons ? icon : ""}<span>${word}</span></button>`;
  }

  function drawerHtml(t, v) {
    return `<div class="expand">
      ${receiptHtml(t, v)}
      <div class="foot">
        ${actionHtml(svgPlay, "Run now", v)}
        ${actionHtml(svgPause, "Pause", v)}
        ${actionHtml(svgHist, "All runs", v)}
        ${actionHtml(svgEye, "View task", v)}
      </div>
    </div>`;
  }

  function metaHtml(t, v) {
    let line = [t.sched, `avg ${t.avg}/run`, t.model].join(" · ");
    if (t.state && t.state.kind === "fail") line = `<span class="bad">${t.state.label}</span> · ` + line;
    if (v.liveWord && t.state && t.state.kind === "live") line += ` · <span class="live">${t.state.label}</span>`;
    return line;
  }

  function rowHtml(t, v) {
    const open = t.open;
    return `<div class="card${open ? " open" : ""}">
      <div class="prow" tabindex="0">
        <div class="id">
          <div class="name">${t.name}</div>
          <div class="sched">${metaHtml(t, v)}</div>
        </div>
        ${barsHtml(t.week)}
      </div>
      <div style="${open ? "" : "display:none"}">${drawerHtml(t, v)}</div>
    </div>`;
  }

  function screenHtml(v) {
    const groups = [...new Set(TASKS.map(t => t.group))];
    const chapters = groups.map(g => {
      const rows = TASKS.filter(t => t.group === g).map(t => rowHtml(t, v)).join("");
      return `<div class="chapter">${g}</div>${rows}`;
    }).join("");
    return `${mastheadHtml()}
    <div class="sheet${v.squared ? " squared" : ""}">
      ${glyphsHtml()}
      <div class="list">${chapters}
        <div class="ghost" tabindex="0">+ New task</div>
      </div>
      <p class="totals">This program: 118 runs · $27.40 · 6.1M tokens in the last 30 days</p>
      <p class="hint">⌘K to search</p>
    </div>`;
  }

  const VARIATIONS = {
    p1: { icons: true, lbl: true, liveWord: true, squared: false },
    p2: { icons: false, lbl: false, liveWord: false, squared: false },
    p3: { icons: false, lbl: false, liveWord: false, squared: true }
  };

  for (const [id, v] of Object.entries(VARIATIONS)) {
    document.getElementById(id).innerHTML = screenHtml(v);
  }

  /* ------- study chrome: tabs, captions, theme ------- */
  const screens = [...document.querySelectorAll(".screen")];
  const tabs = document.getElementById("tabs");
  const caption = document.getElementById("caption");

  screens.forEach((s, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.role = "tab";
    b.innerHTML = `<span class="k">${i + 1}</span>${s.dataset.name}`;
    b.addEventListener("click", () => select(i));
    tabs.appendChild(b);
  });

  function select(i) {
    screens.forEach((s, j) => s.classList.toggle("active", i === j));
    [...tabs.children].forEach((b, j) => b.setAttribute("aria-selected", i === j));
    caption.innerHTML = screens[i].dataset.caption;
  }
  select(2);

  document.addEventListener("keydown", e => {
    const n = Number(e.key);
    if (n >= 1 && n <= screens.length && !e.metaKey && !e.ctrlKey) select(n - 1);
  });

  document.querySelectorAll(".theme button").forEach(b => {
    b.addEventListener("click", () => {
      if (b.dataset.set) document.documentElement.dataset.theme = b.dataset.set;
      else delete document.documentElement.dataset.theme;
    });
  });

  /* ------- hover tip on the bars ------- */
  const tip = document.createElement("div");
  tip.className = "tip";
  document.body.appendChild(tip);

  document.addEventListener("mouseover", e => {
    const bar = e.target.closest(".bars i");
    if (!bar || !bar.dataset.tip) { tip.style.display = "none"; return; }
    const box = bar.getBoundingClientRect();
    tip.innerHTML = bar.dataset.tip;
    tip.style.left = box.left + box.width / 2 + "px";
    tip.style.top = box.top + "px";
    tip.style.display = "block";
  });
  document.addEventListener("scroll", () => { tip.style.display = "none"; }, true);

  /* toggle drawers on row click; bar clicks are the run's door */
  document.addEventListener("click", e => {
    if (e.target.closest(".bars i")) return;
    const row = e.target.closest(".prow");
    if (!row) return;
    const card = row.closest(".card");
    const wasOpen = card.classList.contains("open");
    card.closest(".list").querySelectorAll(".card.open").forEach(c => {
      c.classList.remove("open");
      c.querySelector(".expand").parentElement.style.display = "none";
    });
    if (!wasOpen) {
      card.classList.add("open");
      card.querySelector(".expand").parentElement.style.display = "";
    }
  });
</script>
