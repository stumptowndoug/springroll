<meta charset="utf-8">
<title>The Medium Card — six plays</title>
<style>
  /* Spring Roll tokens (assets/css/app.css, rice paper 2026-07-14) */
  :root {
    --bg: #fdfcfa;
    --bg-2: #f4f3ee;
    --ink: #3a382f;
    --muted: #7d7b74;
    --faint: #aeaca4;
    --border-strong: #d8d6d0;
    --hover: rgb(58 56 47 / 0.06);
    --active: rgb(58 56 47 / 0.1);
    --accent: #3f8f63;
    --accent-text: #357953;
    --accent-ink: #ffffff;
    --primary: #357953;
    --ok: #3f8f63;
    --run: #d98232;
    --fail: #c65346;
    --sans: "Inter", system-ui, -apple-system, sans-serif;
    --pop: 0 4px 16px rgb(15 15 15 / 0.12);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e1e; --bg-2: #262626; --ink: #e6e4e0; --muted: #9b9a96; --faint: #6f6e6a;
      --border-strong: #474744; --hover: rgb(255 255 255 / 0.055); --active: rgb(255 255 255 / 0.09);
      --accent: #3f8f63; --accent-text: #7cc296; --primary: #357953;
      --ok: #5bab80; --run: #e0934f; --fail: #e06a58;
      --pop: 0 4px 16px rgb(0 0 0 / 0.45);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1e1e1e; --bg-2: #262626; --ink: #e6e4e0; --muted: #9b9a96; --faint: #6f6e6a;
    --border-strong: #474744; --hover: rgb(255 255 255 / 0.055); --active: rgb(255 255 255 / 0.09);
    --accent: #3f8f63; --accent-text: #7cc296; --primary: #357953;
    --ok: #5bab80; --run: #e0934f; --fail: #e06a58;
    --pop: 0 4px 16px rgb(0 0 0 / 0.45);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #fdfcfa; --bg-2: #f4f3ee; --ink: #3a382f; --muted: #7d7b74; --faint: #aeaca4;
    --border-strong: #d8d6d0; --hover: rgb(58 56 47 / 0.06); --active: rgb(58 56 47 / 0.1);
    --accent: #3f8f63; --accent-text: #357953; --primary: #357953;
    --ok: #3f8f63; --run: #d98232; --fail: #c65346;
    --pop: 0 4px 16px rgb(15 15 15 / 0.12);
    color-scheme: light;
  }

  html { -webkit-font-smoothing: antialiased; }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.6; margin: 0; }

  .study { position: sticky; top: 0; z-index: 10; background: var(--bg); padding: 14px 20px 10px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
  .study h1 { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 auto 0 0; }
  .tabs { display: flex; flex-wrap: wrap; gap: 2px; background: var(--bg-2); border-radius: 8px; padding: 3px; }
  .tabs button { font: 500 13px/1.4 var(--sans); color: var(--muted); background: transparent; border: 0; border-radius: 6px; padding: 4px 11px; cursor: pointer; }
  .tabs button:hover { color: var(--ink); }
  .tabs button[aria-selected="true"] { background: var(--bg); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgb(15 15 15 / 0.06); }
  .tabs button:focus-visible, .theme button:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .tabs .k { color: var(--faint); font-weight: 400; margin-right: 5px; }
  .theme button { font: 500 12px/1 var(--sans); background: transparent; color: var(--faint); border: 0; border-radius: 6px; padding: 6px 8px; cursor: pointer; }
  .theme button:hover { color: var(--ink); }

  .caption { max-width: 720px; margin: 4px auto 0; padding: 0 24px; text-align: center; font-size: 14px; color: var(--muted); }
  .caption strong { color: var(--ink); font-weight: 600; }

  .screen { display: none; padding: 28px 24px 96px; }
  .screen.active { display: block; }
  .sheet { max-width: 720px; margin: 0 auto; }

  .pagehead { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 8px; }
  .pagehead h2 { font-size: 16px; font-weight: 600; margin: 0; color: var(--ink); }
  .pagehead span { font-size: 13px; color: var(--faint); }

  /* ---- the card ---- */
  .card { margin: 0 -16px; padding: 18px 16px; border-radius: 12px; transition: background 0.12s; }
  .card:hover { background: var(--hover); }
  .card .title { font-size: 17px; font-weight: 600; line-height: 1.35; color: var(--ink); margin: 0; cursor: pointer; }
  .card .title:hover { color: var(--accent-text); }
  .card.paused .title { color: var(--muted); font-weight: 500; }
  .card .desc { font-size: 14px; line-height: 1.55; color: var(--muted); margin: 3px 0 0;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .card.paused .desc { color: var(--faint); }

  .foot { display: flex; align-items: center; gap: 16px; margin-top: 12px; }
  .meta { display: flex; flex-wrap: wrap; align-items: center; gap: 5px 14px; min-width: 0;
    font-size: 13px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .meta .stat { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
  .meta svg { width: 13px; height: 13px; flex: none; }
  .meta .bad { color: var(--fail); }
  .meta .live { color: var(--run); }
  .spacer { flex: 1; }

  .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
  .dot.run { background: var(--run); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) { .dot.run { animation: none; } }

  /* quiet trailing icon buttons (the ⋯ family) */
  .icobtn { background: transparent; border: 0; border-radius: 8px; width: 34px; height: 34px; flex: none;
    display: grid; place-items: center; color: var(--faint); cursor: pointer; }
  .icobtn:hover { background: var(--hover); color: var(--ink); }
  .icobtn svg { width: 16px; height: 16px; }

  /* ---- A · Byline: outline circles, Medium-faithful ---- */
  .playring { width: 36px; height: 36px; border-radius: 50%; flex: none; background: var(--bg-2);
    display: grid; place-items: center; color: var(--ink); border: 0; cursor: pointer; transition: background 0.12s, color 0.12s; }
  .playring:hover { background: var(--accent); color: var(--accent-ink); }
  .playring svg { width: 15px; height: 15px; margin-left: 1px; }
  .playring.pausering svg { margin-left: 0; }

  /* ---- B · Filled: the Spotify move ---- */
  .playfill { width: 38px; height: 38px; border-radius: 50%; flex: none; background: var(--primary); color: var(--accent-ink);
    border: 0; cursor: pointer; display: grid; place-items: center; transition: transform 0.12s, filter 0.12s; }
  .playfill:hover { filter: brightness(1.08); transform: scale(1.05); }
  .playfill svg { width: 15px; height: 15px; margin-left: 1px; fill: currentColor; stroke: none; }
  .playfill svg.stroked, .leadplay svg.stroked { fill: none; stroke: currentColor; }
  .pausefill { background: var(--bg-2); color: var(--muted); }
  .pausefill:hover { color: var(--ink); }
  .pausefill svg { margin-left: 0; }

  /* ---- C · Leading: the podcast row ---- */
  .lead { display: flex; gap: 16px; align-items: flex-start; }
  .leadplay { width: 44px; height: 44px; border-radius: 50%; flex: none; margin-top: 2px;
    background: var(--bg-2); color: var(--ink); border: 0; cursor: pointer; display: grid; place-items: center;
    transition: background 0.12s, color 0.12s; }
  .leadplay:hover { background: var(--primary); color: var(--accent-ink); }
  .leadplay svg { width: 17px; height: 17px; margin-left: 2px; fill: currentColor; stroke: none; }
  .leadplay.leadpause svg { margin-left: 0; }
  .lead .body { min-width: 0; flex: 1; }
  .lead .foot { margin-top: 8px; }

  /* ---- D · Worded pills ---- */
  .pill { display: inline-flex; align-items: center; gap: 7px; border: 0; border-radius: 999px; cursor: pointer;
    font: 500 13px/1 var(--sans); padding: 8px 14px; background: var(--bg-2); color: var(--ink); white-space: nowrap;
    transition: background 0.12s, color 0.12s; }
  .pill:hover { background: var(--active); }
  .pill.go { background: var(--primary); color: var(--accent-ink); }
  .pill.go:hover { filter: brightness(1.08); }
  .pill svg { width: 13px; height: 13px; flex: none; }
  .pill.go svg { fill: currentColor; stroke: none; }
  .pill.quiet { background: transparent; color: var(--muted); }
  .pill.quiet:hover { background: var(--hover); color: var(--ink); }

  /* ---- E · Strip as art ---- */
  .arted { display: flex; gap: 24px; align-items: flex-start; }
  .arted .body { min-width: 0; flex: 1; }
  .art { flex: none; width: 118px; height: 64px; border-radius: 8px; background: var(--bg-2);
    display: flex; align-items: flex-end; justify-content: center; gap: 5px; padding: 0 12px 10px; box-sizing: border-box; }
  .art i { width: 9px; border-radius: 2px 2px 0 0; background: var(--ok); }
  .art i.fail { background: var(--fail); }
  .art i.live { background: var(--run); animation: pulse 1.6s ease-in-out infinite; }
  .art i.stub { background: var(--border-strong); opacity: 0.6; border-radius: 1px; }
  @media (prefers-reduced-motion: reduce) { .art i.live { animation: none; } }

  /* ---- F · Quiet till hover ---- */
  .shy .foot .acts { opacity: 0; transition: opacity 0.15s; }
  .shy:hover .foot .acts, .shy:focus-within .foot .acts { opacity: 1; }
  .shy .desc { -webkit-line-clamp: 1; }
  .acts { display: flex; align-items: center; gap: 6px; flex: none; }

  @media (max-width: 560px) {
    .arted .art { display: none; }
  }

  .totals { margin-top: 44px; text-align: center; font-size: 13px; color: var(--faint); font-variant-numeric: tabular-nums; }
</style>

<header class="study">
  <h1>The Medium Card — six plays</h1>
  <div class="tabs" role="tablist" id="tabs"></div>
  <span class="theme">
    <button type="button" data-set="light" aria-label="Light theme">light</button>
    <button type="button" data-set="dark" aria-label="Dark theme">dark</button>
    <button type="button" data-set="" aria-label="System theme">system</button>
  </span>
</header>
<p class="caption" id="caption"></p>

<section class="screen" id="a" data-name="A · Byline"
  data-caption="<strong>A · Byline.</strong> The Medium card straight: title, two-line description, then one footer line — schedule and avg-$ stats on the left, a tonal circular play (pause when scheduled &amp; on) and ⋯ on the right. Last run is gone; status survives only as a word in the meta when something is failed, running, or paused."></section>

<section class="screen" id="b" data-name="B · Filled play"
  data-caption="<strong>B · Filled play.</strong> Same bones, but the play button commits: a filled green circle, the page&rsquo;s one loud control per card. Pause stays tonal so an armed schedule reads quieter than a manual invitation. The green is --primary, the same ink as the app&rsquo;s filled buttons."></section>

<section class="screen" id="c" data-name="C · Leading play"
  data-caption="<strong>C · Leading play.</strong> The podcast row: a 44px play leads the card and the text hangs off it, so the eye learns one gesture — button, then read. Paused tasks show a resume arrow in the same seat. Densest of the six verticals; the button is the bullet."></section>

<section class="screen" id="d" data-name="D · Worded pills"
  data-caption="<strong>D · Worded pills.</strong> The buttons say their names: <em>Run now</em> filled, <em>Pause</em>/<em>Resume</em> tonal. No icon ambiguity, friendlier to new eyes, and the pill row gives the footer a firm right edge. Costs the most horizontal space of the six."></section>

<section class="screen" id="e" data-name="E · Strip as art"
  data-caption="<strong>E · Strip as art.</strong> Medium puts a thumbnail on the right; our thumbnail is the week itself — the cost strip framed on a bg-2 card, doing the last-run job at a glance (green week, red today, pulsing now). Play stays a tonal circle in the footer."></section>

<section class="screen" id="f" data-name="F · Quiet till hover"
  data-caption="<strong>F · Quiet till hover.</strong> The calmest sheet: one-line descriptions, no buttons at rest. Hover (or tab into) a card and the play + ⋯ fade in on the footer line. The page reads like a list until you point at the task you mean."></section>

<script>
  /* ------- data: the real workspace, Jul 16 2026 ------- */
  const TASKS = [
    {
      name: "AssessorSearch Subscription Trends",
      desc: "Pulls yesterday's subscription events, compares against the trailing four weeks, and writes a short trend note with any accounts that changed tier.",
      sched: "daily 6:00 am · next in 15h", avg: "$0.42",
      state: { kind: "fail", label: "failed today" }, scheduled: true, enabled: true,
      week: ["ok","ok","ok","ok","ok","ok","fail"], heights: [20,22,21,24,23,20,5]
    },
    {
      name: "AssessorSearch API Usage Analysis",
      desc: "Reads the API logs for the last 24 hours and summarizes call volume, error rates, and the five heaviest endpoints.",
      sched: "daily 7:00 am · next in 16h", avg: "$0.30",
      state: null, scheduled: true, enabled: true,
      week: ["ok","ok","ok","ok","ok","ok","ok"], heights: [18,19,19,21,20,22,20]
    },
    {
      name: "Daily Google Trends Report",
      desc: "Checks search interest for the product's tracked keywords and flags anything moving more than two standard deviations from its monthly baseline.",
      sched: "daily 8:00 am · next in 17h", avg: "$0.13",
      state: { kind: "live", label: "running" }, scheduled: true, enabled: true,
      week: ["ok","ok","ok","ok","ok","ok","live"], heights: [18,20,17,22,18,20,6]
    },
    {
      name: "Weekly Competitor Digest",
      desc: "Visits each competitor's changelog and pricing page, then writes a one-page digest of what shipped and what moved.",
      sched: "paused · weekly Mon 9:00 am", avg: "$1.10",
      state: { kind: "paused", label: "paused" }, scheduled: true, enabled: false,
      week: ["ok","none","none","none","none","none","none"], heights: [22,2,2,2,2,2,2]
    },
    {
      name: "Current Weather Comparison",
      desc: "Compares today's forecast across three providers for the office cities and notes where they disagree.",
      sched: "manual", avg: "$0.04",
      state: null, scheduled: false, enabled: true,
      week: ["none","none","none","ok","none","none","none"], heights: [2,2,2,14,2,2,2]
    }
  ];

  /* lucide outlines */
  const S = 'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
  const svgPlay = `<svg ${S}><polygon points="6 3 20 12 6 21 6 3"/></svg>`;
  const svgPlayFill = `<svg viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"/></svg>`;
  const svgPause = `<svg ${S}><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></svg>`;
  const svgPauseFill = `<svg viewBox="0 0 24 24"><rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/></svg>`;
  const svgResume = `<svg class="stroked" ${S}><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>`;
  const svgClock = `<svg ${S}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>`;
  const svgCoins = `<svg ${S}><circle cx="8" cy="8" r="6"/><path d="M18.09 10.37A6 6 0 1 1 10.34 18"/><path d="M7 6h1v4"/><path d="m16.71 13.88.7.71-2.82 2.82"/></svg>`;
  const svgMore = `<svg ${S}><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>`;
  const svgHand = `<svg ${S}><path d="M18 11V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2"/><path d="M14 10V4a2 2 0 0 0-2-2a2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2a2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/></svg>`;

  function stateStat(t) {
    if (!t.state) return "";
    if (t.state.kind === "fail") return `<span class="stat bad">${t.state.label}</span>`;
    if (t.state.kind === "live") return `<span class="stat live"><span class="dot run"></span>${t.state.label}</span>`;
    return "";
  }

  function metaHtml(t, { schedIcon = true } = {}) {
    const schedSvg = t.scheduled ? svgClock : svgHand;
    return `<div class="meta">
      ${stateStat(t)}
      <span class="stat">${schedIcon ? schedSvg : ""}${t.sched}</span>
      <span class="stat">${svgCoins}${t.avg} avg</span>
    </div>`;
  }

  /* pause seat: pause when armed, resume when paused, nothing when manual */
  function pauseBtn(t, cls, icon, resumeIcon) {
    if (!t.scheduled) return "";
    if (!t.enabled) return `<button type="button" class="${cls}" title="Resume schedule" aria-label="Resume ${t.name}">${resumeIcon}</button>`;
    return `<button type="button" class="${cls}" title="Pause schedule" aria-label="Pause ${t.name}">${icon}</button>`;
  }

  const more = `<button type="button" class="icobtn" title="More" aria-label="More actions">${svgMore}</button>`;

  function cardShell(t, inner, extra = "") {
    return `<article class="card${t.enabled ? "" : " paused"}${extra}">${inner}</article>`;
  }

  function titleBlock(t) {
    return `<h3 class="title">${t.name}</h3><p class="desc">${t.desc}</p>`;
  }

  /* ---- A · Byline ---- */
  function cardA(t) {
    return cardShell(t, `
      ${titleBlock(t)}
      <div class="foot">
        ${metaHtml(t)}
        <span class="spacer"></span>
        <div class="acts">
          ${pauseBtn(t, "playring pausering", svgPause, svgResume)}
          <button type="button" class="playring" title="Run now" aria-label="Run ${t.name} now">${svgPlay}</button>
          ${more}
        </div>
      </div>`);
  }

  /* ---- B · Filled play ---- */
  function cardB(t) {
    return cardShell(t, `
      ${titleBlock(t)}
      <div class="foot">
        ${metaHtml(t)}
        <span class="spacer"></span>
        <div class="acts">
          ${pauseBtn(t, "playfill pausefill", svgPauseFill, svgResume)}
          <button type="button" class="playfill" title="Run now" aria-label="Run ${t.name} now">${svgPlayFill}</button>
        </div>
      </div>`);
  }

  /* ---- C · Leading play ---- */
  function cardC(t) {
    const seat = t.enabled
      ? `<button type="button" class="leadplay" title="Run now" aria-label="Run ${t.name} now">${svgPlayFill}</button>`
      : `<button type="button" class="leadplay leadpause" title="Resume schedule" aria-label="Resume ${t.name}">${svgResume}</button>`;
    return cardShell(t, `
      <div class="lead">
        ${seat}
        <div class="body">
          ${titleBlock(t)}
          <div class="foot">
            ${metaHtml(t)}
            <span class="spacer"></span>
            ${more}
          </div>
        </div>
      </div>`);
  }

  /* ---- D · Worded pills ---- */
  function cardD(t) {
    let toggle = "";
    if (t.scheduled) {
      toggle = t.enabled
        ? `<button type="button" class="pill">${svgPause}<span>Pause</span></button>`
        : `<button type="button" class="pill">${svgResume}<span>Resume</span></button>`;
    }
    return cardShell(t, `
      ${titleBlock(t)}
      <div class="foot">
        ${metaHtml(t)}
        <span class="spacer"></span>
        <div class="acts">
          ${toggle}
          <button type="button" class="pill go">${svgPlayFill}<span>Run now</span></button>
        </div>
      </div>`);
  }

  /* ---- E · Strip as art ---- */
  function artHtml(t) {
    const bars = t.week.map((s, i) => {
      const h = t.heights[i];
      const cls = s === "none" ? "stub" : s === "ok" ? "" : s;
      return `<i class="${cls}" style="height:${Math.max(h, 2) * 1.35}px"></i>`;
    }).join("");
    return `<div class="art" aria-label="Last seven days">${bars}</div>`;
  }

  function cardE(t) {
    return cardShell(t, `
      <div class="arted">
        <div class="body">
          ${titleBlock(t)}
          <div class="foot">
            ${metaHtml(t)}
            <span class="spacer"></span>
            <div class="acts">
              ${pauseBtn(t, "playring pausering", svgPause, svgResume)}
              <button type="button" class="playring" title="Run now" aria-label="Run ${t.name} now">${svgPlay}</button>
            </div>
          </div>
        </div>
        ${artHtml(t)}
      </div>`);
  }

  /* ---- F · Quiet till hover ---- */
  function cardF(t) {
    return cardShell(t, `
      ${titleBlock(t)}
      <div class="foot">
        ${metaHtml(t)}
        <span class="spacer"></span>
        <div class="acts">
          ${pauseBtn(t, "playring pausering", svgPause, svgResume)}
          <button type="button" class="playring" title="Run now" aria-label="Run ${t.name} now">${svgPlay}</button>
          ${more}
        </div>
      </div>`, " shy");
  }

  /* ------- assembly ------- */
  const RENDER = { a: cardA, b: cardB, c: cardC, d: cardD, e: cardE, f: cardF };

  function sheetHtml(render) {
    return `<div class="sheet">
      <div class="pagehead"><h2>Tasks</h2><span>5 tasks</span></div>
      ${TASKS.map(render).join("")}
      <p class="totals">This program: 41 runs · $9.87 · 2.1M tokens in the last 30 days</p>
    </div>`;
  }

  const screens = [...document.querySelectorAll(".screen")];
  const tabsEl = document.getElementById("tabs");
  const captionEl = document.getElementById("caption");

  screens.forEach((screen, index) => {
    screen.innerHTML = sheetHtml(RENDER[screen.id]);
    const button = document.createElement("button");
    button.type = "button";
    button.setAttribute("role", "tab");
    button.innerHTML = `<span class="k">${index + 1}</span>${screen.dataset.name}`;
    button.addEventListener("click", () => select(index));
    tabsEl.appendChild(button);
  });

  function select(index) {
    screens.forEach((screen, i) => screen.classList.toggle("active", i === index));
    [...tabsEl.children].forEach((tab, i) => tab.setAttribute("aria-selected", String(i === index)));
    captionEl.innerHTML = screens[index].dataset.caption;
  }
  select(0);

  document.addEventListener("keydown", (event) => {
    if (event.target.closest("input, textarea")) return;
    const index = Number(event.key) - 1;
    if (index >= 0 && index < screens.length) select(index);
  });

  document.querySelectorAll(".theme button").forEach((button) => {
    button.addEventListener("click", () => {
      const value = button.dataset.set;
      if (value) document.documentElement.dataset.theme = value;
      else delete document.documentElement.dataset.theme;
    });
  });
</script>
