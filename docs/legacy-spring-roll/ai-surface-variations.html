<meta charset="utf-8">
<title>The AI Surface — five rooms for the spark</title>
<style>
  /* Spring Roll tokens (assets/css/app.css, rice paper 2026-07-14) */
  :root {
    --bg: #fdfcfa; --bg-2: #f4f3ee; --ink: #3a382f; --muted: #7d7b74; --faint: #aeaca4;
    --border-strong: #d8d6d0; --hover: rgb(58 56 47 / 0.06);
    --accent: #3f8f63; --accent-text: #357953; --ok: #3f8f63; --run: #d98232; --fail: #c65346;
    --sans: "Inter", system-ui, -apple-system, sans-serif;
    --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
    --pop: 0 1px 2px rgb(15 15 15 / 0.05), 0 5px 18px rgb(15 15 15 / 0.09);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e1e; --bg-2: #262626; --ink: #e6e4e0; --muted: #9b9a96; --faint: #6f6e6a;
      --border-strong: #474744; --hover: rgb(255 255 255 / 0.055);
      --accent: #3f8f63; --accent-text: #7cc296; --ok: #5bab80; --run: #e0934f; --fail: #e06a58;
      --pop: 0 1px 2px rgb(0 0 0 / 0.3), 0 5px 18px rgb(0 0 0 / 0.45);
    }
  }
  :root[data-theme="dark"] {
    --bg: #1e1e1e; --bg-2: #262626; --ink: #e6e4e0; --muted: #9b9a96; --faint: #6f6e6a;
    --border-strong: #474744; --hover: rgb(255 255 255 / 0.055);
    --accent: #3f8f63; --accent-text: #7cc296; --ok: #5bab80; --run: #e0934f; --fail: #e06a58;
    --pop: 0 1px 2px rgb(0 0 0 / 0.3), 0 5px 18px rgb(0 0 0 / 0.45);
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #fdfcfa; --bg-2: #f4f3ee; --ink: #3a382f; --muted: #7d7b74; --faint: #aeaca4;
    --border-strong: #d8d6d0; --hover: rgb(58 56 47 / 0.06);
    --accent: #3f8f63; --accent-text: #357953; --ok: #3f8f63; --run: #d98232; --fail: #c65346;
    --pop: 0 1px 2px rgb(15 15 15 / 0.05), 0 5px 18px rgb(15 15 15 / 0.09);
    color-scheme: light;
  }

  html { -webkit-font-smoothing: antialiased; }
  body { background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.65; margin: 0; }

  .study { position: sticky; top: 0; z-index: 60; background: var(--bg); padding: 14px 20px 10px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
  .study h1 { font-size: 13px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0 auto 0 0; }
  .tabs { display: flex; flex-wrap: wrap; gap: 2px; background: var(--bg-2); border-radius: 8px; padding: 3px; }
  .tabs button { font: 500 13px/1.4 var(--sans); color: var(--muted); background: transparent; border: 0; border-radius: 6px; padding: 4px 11px; cursor: pointer; }
  .tabs button:hover { color: var(--ink); }
  .tabs button[aria-selected="true"] { background: var(--bg); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgb(15 15 15 / 0.06); }
  .tabs .k { color: var(--faint); font-weight: 400; margin-right: 5px; }
  .theme button { font: 500 12px/1 var(--sans); background: transparent; color: var(--faint); border: 0; border-radius: 6px; padding: 6px 8px; cursor: pointer; }
  .theme button:hover { color: var(--ink); }

  .caption { max-width: 780px; margin: 4px auto 0; padding: 0 24px; text-align: center; font-size: 14px; color: var(--muted); }
  .caption strong { color: var(--ink); }

  .screen { display: none; position: relative; }
  .screen.active { display: block; }

  /* chrome (as decided: heartbeat + ⌕ + ✦, no ＋) */
  .glyph { display: inline-flex; width: 38px; height: 38px; align-items: center; justify-content: center;
    border-radius: 8px; background: none; border: 0; color: var(--muted); cursor: pointer; text-decoration: none; }
  .glyph:hover { background: var(--hover); color: var(--ink); }
  .glyph svg { width: 19px; height: 19px; }
  .glyph.lit { background: var(--hover); color: var(--accent-text); }
  .bar { display: flex; align-items: center; gap: 10px; padding: 10px 16px; }
  .bar .mark { font-size: 15px; font-weight: 600; letter-spacing: -0.01em; color: var(--ink); text-decoration: none; }
  .bar .end { margin-left: auto; display: flex; align-items: center; gap: 2px; }
  .pulse { display: inline-flex; align-items: center; gap: 8px; padding: 7px 12px; border-radius: 999px;
    background: none; border: 0; cursor: pointer; font: 500 13px/1 var(--sans); color: var(--muted); }
  .pulse:hover { background: var(--hover); color: var(--ink); }
  .pulse .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--run); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) { .pulse .dot, .caret { animation: none; } }

  .shell { display: flex; align-items: flex-start; }
  .rail { flex: none; width: 190px; padding: 16px 12px; }
  .rail nav { display: flex; flex-direction: column; gap: 4px; }
  .rail a { display: flex; align-items: center; gap: 14px; padding: 10px; border-radius: 8px;
    font-size: 14px; font-weight: 500; color: var(--muted); text-decoration: none; white-space: nowrap; }
  .rail a svg { width: 18px; height: 18px; flex: none; color: var(--faint); }
  .rail a:hover { background: var(--hover); color: var(--ink); }
  .rail a.active { color: var(--ink); background: var(--hover); }
  .rail a.active svg { color: var(--accent-text); }

  /* floating new-task circle, bottom right */
  .fab { position: absolute; right: 26px; bottom: 22px; width: 48px; height: 48px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center; background: var(--bg-2); border: 0;
    color: var(--muted); cursor: pointer; box-shadow: var(--pop); }
  .fab:hover { color: var(--ink); }
  .fab svg { width: 20px; height: 20px; }

  /* the reader page beneath */
  .sheet { max-width: 780px; margin: 0 auto; padding: 20px 32px 120px; }
  .title { margin: 0; font-size: 27px; line-height: 1.15; font-weight: 600; letter-spacing: -0.02em; color: var(--ink); }
  .meta { margin-top: 10px; display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .meta .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--fail); }
  .meta .bad { color: var(--fail); font-weight: 500; }
  .meta .sep { color: var(--faint); }
  .flag { margin-top: 22px; border-radius: 10px; background: color-mix(in srgb, var(--fail) 8%, transparent); padding: 13px 17px; font-size: 14px; }
  .flag .head { font-weight: 600; color: var(--fail); }
  .flag .body { margin-top: 3px; color: color-mix(in srgb, var(--ink) 80%, transparent); }
  .doc { margin-top: 26px; font-family: var(--serif); font-size: 16.5px; line-height: 1.75; color: color-mix(in srgb, var(--ink) 88%, transparent); }

  /* ---- shared AI exchange pieces ---- */
  .ask-q { font-size: 14px; font-weight: 500; color: var(--ink); }
  .ask-q .who { color: var(--faint); font-weight: 600; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; margin-right: 8px; }
  .ask-a { margin-top: 10px; font-family: var(--serif); font-size: 15.5px; line-height: 1.7; color: color-mix(in srgb, var(--ink) 88%, transparent); }
  .ask-a b { color: var(--ink); }
  .chips { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 4px; }
  .chip { display: inline-flex; align-items: center; gap: 7px; border: 0; border-radius: 6px; background: none;
    padding: 5px 9px; font: 500 13px/1.4 var(--sans); color: var(--accent-text); cursor: pointer; }
  .chip:hover { background: var(--hover); }
  .chip svg { width: 13px; height: 13px; }
  .ask-in { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--faint); padding: 10px 0 0; }
  .ask-in svg { width: 15px; height: 15px; color: var(--accent-text); }
  .ask-in .caret { color: var(--accent-text); animation: pulse 1.1s step-end infinite; }

  /* v1: right panel */
  .panelwrap { display: flex; align-items: flex-start; gap: 0; }
  .sidepanel { flex: none; width: 340px; margin: 6px 18px 0 0; padding: 18px 20px 20px; border-radius: 14px;
    background: var(--bg); box-shadow: var(--pop); position: sticky; top: 64px; }
  .sidepanel .head { display: flex; align-items: center; gap: 9px; font-size: 12px; font-weight: 600;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--faint); padding-bottom: 14px; }
  .sidepanel .head svg { width: 14px; height: 14px; color: var(--accent-text); }
  .sidepanel .head .x { margin-left: auto; color: var(--faint); cursor: pointer; font-size: 15px; letter-spacing: 0; }
  .sidepanel .scope { font-size: 12px; color: var(--faint); margin-bottom: 12px; }

  /* v2: quick ask card */
  .qa-scrim { position: absolute; inset: 0; background: rgb(15 15 15 / 0.14); z-index: 10; }
  .qacard { position: absolute; z-index: 11; top: 70px; left: 50%; transform: translateX(-50%);
    width: min(600px, 92%); border-radius: 14px; background: var(--bg); box-shadow: var(--pop); padding: 20px 24px; }

  /* v3: in the margins */
  .inline-ask { margin: 26px 0 6px; border-radius: 12px; background: var(--bg-2); padding: 16px 20px 18px; }

  /* v4: the counter */
  .counter { position: absolute; z-index: 11; left: 0; right: 0; bottom: 0; background: var(--bg);
    box-shadow: var(--pop); padding: 14px 26px 16px; }
  .counter .inner { max-width: 820px; margin: 0 auto; }
  .counter .inrow { display: flex; align-items: center; gap: 12px; }
  .counter .inrow .mic { margin-left: auto; }
  .counter .hint { font-size: 11.5px; color: var(--faint); margin-top: 6px; }

  /* v5: the parlor */
  .parlor-ask { display: flex; align-items: center; gap: 12px; margin-top: 22px; padding: 13px 16px;
    border-radius: 12px; background: var(--bg-2); font-size: 15px; color: var(--faint); }
  .parlor-ask svg { width: 16px; height: 16px; color: var(--accent-text); }
  .chapter { margin: 30px 0 4px; font-size: 16px; font-weight: 500; color: var(--faint); }
  .arow { display: flex; align-items: baseline; gap: 14px; margin: 0 -12px; padding: 8px 12px; border-radius: 10px; font-size: 15px; }
  .arow:hover { background: var(--hover); }
  .arow .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); align-self: center; flex: none; }
  .arow .q { min-width: 0; flex: 1; color: var(--ink); font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .arow .when { font-size: 13px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .arow.open { background: var(--hover); }
  .aopen { margin: 0 -12px; padding: 2px 14px 16px; }
</style>

<header class="study">
  <h1>The AI Surface — five rooms for the spark</h1>
  <div class="tabs" role="tablist" id="tabs"></div>
  <span class="theme">
    <button type="button" data-set="light">light</button>
    <button type="button" data-set="dark">dark</button>
    <button type="button" data-set="">system</button>
  </span>
</header>
<p class="caption" id="caption"></p>

<section class="screen" id="v1" data-name="Right panel"
  data-caption="<strong>Right panel.</strong> The logical one: ✦ slides a companion panel in from the right — floating on shadow, no borders — scoped to the page you&rsquo;re on (&ldquo;about this run&rdquo;). The document stays visible; you read and ask side by side. Familiar from every copilot; the cost is a second column of chrome and a cramped document on smaller screens."></section>

<section class="screen" id="v2" data-name="Quick ask"
  data-caption="<strong>Quick ask.</strong> ✦ (or ⌘K) summons a centered card: one question, one answer, action chips, gone. No standing surface anywhere — AI is a moment, not a place. Shares its skeleton with the search palette, so search and ask converge later for free. Weakest for long back-and-forth; strongest for &lsquo;why did this fail?&rsquo;"></section>

<section class="screen" id="v3" data-name="In the margins"
  data-caption="<strong>In the margins.</strong> The house answer — no popovers, actions belong IN the document: ✦ composes the exchange into the page itself, a quiet bg-2 passage right where you&rsquo;re reading. The answer is set in the reader serif because the agent wrote it. Scrolls with the letter, dismisses inline. The most Spring Roll; the least like anyone else&rsquo;s AI."></section>

<section class="screen" id="v4" data-name="The counter"
  data-caption="<strong>The counter.</strong> A bar slides up from the bottom — you talk across it. Built voice-first: mic at the end, hold-space-to-talk, answers stack above the input. This is the dock idea&rsquo;s heir (the seat once reserved for the mic). Great for hands-on-keyboard operators; the cost is a persistent strip covering the colophon while open."></section>

<section class="screen" id="v5" data-name="★ The parlor"
  data-caption="<strong>★ The parlor.</strong> AI as a room, not a widget: ✦ in the rail opens a page whose compose line says the thesis — <em>answers file as runs</em>. Every ask becomes a run document in the same inbox, same anatomy, same colophon; yesterday&rsquo;s answers are searchable history, and a good ask is one click from becoming a scheduled task. No new object types, no floating chrome — the app&rsquo;s own metabolism handles AI."></section>

<script>
  const icons = {
    burger: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/></svg>',
    search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>',
    plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>',
    spark: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.9 5.7a2 2 0 0 0 1.3 1.3L21 12l-5.8 1.9a2 2 0 0 0-1.3 1.3L12 21l-1.9-5.8a2 2 0 0 0-1.3-1.3L3 12l5.8-2a2 2 0 0 0 1.3-1.2L12 3z"/></svg>',
    mic: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" x2="12" y1="19" y2="22"/></svg>',
    rotate: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>',
    tasks: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 7 2 2 4-4"/><path d="m3 17 2 2 4-4"/><path d="M13 6h8"/><path d="M13 12h8"/><path d="M13 18h8"/></svg>',
    runs: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>',
    connect: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22v-5"/><path d="M9 8V2"/><path d="M15 8V2"/><path d="M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8Z"/></svg>',
    integrations: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="14" y="3" rx="1"/><path d="M10 21V8a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-5a1 1 0 0 0-1-1H3"/></svg>',
    settings: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>'
  };

  const bar = (sparkLit) => `<div class="bar">
    <button type="button" class="glyph" aria-label="Collapse navigation">${icons.burger}</button>
    <a class="mark" href="#" onclick="return false">spring roll</a>
    <span class="end">
      <button type="button" class="pulse"><span class="dot"></span> 1 running</button>
      <button type="button" class="glyph" aria-label="Search">${icons.search}</button>
      <button type="button" class="glyph${sparkLit ? " lit" : ""}" aria-label="Ask">${icons.spark}</button>
    </span>
  </div>`;

  const railHtml = (aiRow) => `<div class="rail"><nav>
    ${[["tasks", false], ["runs", !aiRow], ["connect", false], ["integrations", false], ["settings", false]]
      .map(([w, a]) => `<a href="#" onclick="return false" class="${a ? "active" : ""}">${icons[w]}<span>${w}</span></a>`).join("")}
    ${aiRow ? `<a href="#" onclick="return false" class="active">${icons.spark}<span>ask</span></a>` : ""}
  </nav></div>`;

  const fab = `<button type="button" class="fab" aria-label="New task" title="New task">${icons.plus}</button>`;

  const failedPage = `<div class="sheet">
    <h1 class="title">AssessorSearch Subscription Trends</h1>
    <div class="meta"><span class="dot"></span><span class="bad">failed</span><span class="sep">·</span> today 6:01 am <span class="sep">·</span> 1m 12s <span class="sep">·</span> $0.05</div>
    <div class="flag">
      <div class="head">The Run failed on its first pass.</div>
      <div class="body">Neon MCP: connection refused — the branch endpoint expired.</div>
    </div>
    <div class="doc"><p>The Run failed before producing a result. Review the failure above and stderr in the event log.</p></div>
  </div>`;

  const exchange = (scope) => `
    ${scope ? `<div class="scope">${scope}</div>` : ""}
    <div class="ask-q"><span class="who">you</span>why did this fail this morning?</div>
    <div class="ask-a">The 6:01 am run couldn&rsquo;t reach <b>Neon</b> — the branch endpoint it connects
      to expired overnight, so the MCP handshake was refused before any queries ran. Reconnect Neon
      under Integrations and the task should pass; the last good run was yesterday, 6:03 am ($0.40).</div>
    <div class="chips">
      <button type="button" class="chip">${icons.rotate} Run again</button>
      <button type="button" class="chip">open integrations ›</button>
    </div>
    <div class="ask-in">${icons.spark}<span>Ask a follow-up…</span><span class="caret">▍</span></div>`;

  /* v1 — right panel */
  document.getElementById("v1").innerHTML = `${bar(true)}
    <div class="shell">${railHtml(false)}
      <div class="panelwrap" style="flex:1;min-width:0">
        <div style="flex:1;min-width:0">${failedPage}</div>
        <aside class="sidepanel">
          <div class="head">${icons.spark} ask <span class="x">✕</span></div>
          ${exchange("About: AssessorSearch Subscription Trends · today 6:01 am")}
        </aside>
      </div>
    </div>${fab}`;

  /* v2 — quick ask card */
  document.getElementById("v2").innerHTML = `${bar(true)}
    <div class="shell">${railHtml(false)}<div style="flex:1;min-width:0">${failedPage}</div></div>
    <div class="qa-scrim"></div>
    <div class="qacard">${exchange("")}</div>
    ${fab}`;

  /* v3 — in the margins */
  document.getElementById("v3").innerHTML = `${bar(true)}
    <div class="shell">${railHtml(false)}
      <div style="flex:1;min-width:0"><div class="sheet">
        <h1 class="title">AssessorSearch Subscription Trends</h1>
        <div class="meta"><span class="dot"></span><span class="bad">failed</span><span class="sep">·</span> today 6:01 am <span class="sep">·</span> 1m 12s <span class="sep">·</span> $0.05</div>
        <div class="flag">
          <div class="head">The Run failed on its first pass.</div>
          <div class="body">Neon MCP: connection refused — the branch endpoint expired.</div>
        </div>
        <div class="inline-ask">${exchange("")}</div>
        <div class="doc"><p>The Run failed before producing a result. Review the failure above and stderr in the event log.</p></div>
      </div></div>
    </div>${fab}`;

  /* v4 — the counter */
  document.getElementById("v4").innerHTML = `${bar(true)}
    <div class="shell">${railHtml(false)}<div style="flex:1;min-width:0">${failedPage}</div></div>
    <div class="counter"><div class="inner">
      ${exchange("").replace('<div class="ask-in">', '<div class="ask-in inrow">').replace('<span class="caret">▍</span>',
        '<span class="caret">▍</span><button type="button" class="glyph mic" aria-label="Hold to talk">' + icons.mic + "</button>")}
      <div class="hint">hold <b>space</b> to talk · esc closes</div>
    </div></div>`;

  /* v5 — the parlor */
  document.getElementById("v5").innerHTML = `${bar(false)}
    <div class="shell">${railHtml(true)}
      <div style="flex:1;min-width:0"><div class="sheet">
        <h1 class="title">Ask</h1>
        <div class="parlor-ask">${icons.spark}<span>Ask anything — answers file as runs</span><span class="caret" style="color:var(--accent-text)">▍</span></div>
        <div class="chapter">Today</div>
        <div class="arow open"><span class="dot"></span><span class="q">why did subscription trends fail this morning?</span><span class="when">8:12 am</span></div>
        <div class="aopen">
          <div class="ask-a" style="margin-top:2px">The 6:01 am run couldn&rsquo;t reach <b>Neon</b> — the branch endpoint expired overnight,
            so the MCP handshake was refused before any queries ran. Reconnect Neon under Integrations and run the task again.</div>
          <div class="chips">
            <button type="button" class="chip">${icons.rotate} Run again</button>
            <button type="button" class="chip">open integrations ›</button>
            <button type="button" class="chip">${icons.plus} make this a task</button>
          </div>
        </div>
        <div class="arow"><span class="dot"></span><span class="q">which task cost the most this week?</span><span class="when">7:58 am</span></div>
        <div class="chapter">Yesterday</div>
        <div class="arow"><span class="dot"></span><span class="q">summarize the trending repos I starred</span><span class="when">9:52 pm</span></div>
      </div></div>
    </div>${fab}`;

  /* ------- study chrome ------- */
  const screens = [...document.querySelectorAll(".screen")];
  const tabs = document.getElementById("tabs");
  const caption = document.getElementById("caption");

  screens.forEach((s, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.role = "tab";
    b.innerHTML = `<span class="k">${i + 1}</span>${s.dataset.name}`;
    b.addEventListener("click", () => select(i));
    tabs.appendChild(b);
  });

  function select(i) {
    screens.forEach((s, j) => s.classList.toggle("active", i === j));
    [...tabs.children].forEach((b, j) => b.setAttribute("aria-selected", i === j));
    caption.innerHTML = screens[i].dataset.caption;
  }
  select(0);

  document.addEventListener("keydown", e => {
    const n = Number(e.key);
    if (n >= 1 && n <= screens.length && !e.metaKey && !e.ctrlKey) select(n - 1);
  });

  document.querySelectorAll(".theme button").forEach(b => {
    b.addEventListener("click", () => {
      if (b.dataset.set) document.documentElement.dataset.theme = b.dataset.set;
      else delete document.documentElement.dataset.theme;
    });
  });
</script>
