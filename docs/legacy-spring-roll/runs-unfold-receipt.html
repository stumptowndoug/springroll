<title>Runs unfold — the receipt</title>
<style>
  /* Spring Roll tokens (assets/css/app.css, rice paper 2026-07-14) */
  :root {
    --bg: #fdfcfa;
    --bg-2: #f4f3ee;
    --ink: #3a382f;
    --muted: #7d7b74;
    --faint: #aeaca4;
    --border-strong: #d8d6d0;
    --hover: rgb(58 56 47 / 0.06);
    --accent: #3f8f63;
    --accent-text: #357953;
    --ok: #3f8f63;
    --run: #d98232;
    --fail: #c65346;
    --sans: "Inter", system-ui, -apple-system, sans-serif;
    --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1e1e1e;
      --bg-2: #262626;
      --ink: #e6e4e0;
      --muted: #9b9a96;
      --faint: #6f6e6a;
      --border-strong: #474744;
      --hover: rgb(255 255 255 / 0.055);
      --accent: #3f8f63;
      --accent-text: #7cc296;
      --ok: #5bab80;
      --run: #e0934f;
      --fail: #e06a58;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1e1e1e;
    --bg-2: #262626;
    --ink: #e6e4e0;
    --muted: #9b9a96;
    --faint: #6f6e6a;
    --border-strong: #474744;
    --hover: rgb(255 255 255 / 0.055);
    --accent: #3f8f63;
    --accent-text: #7cc296;
    --ok: #5bab80;
    --run: #e0934f;
    --fail: #e06a58;
    color-scheme: dark;
  }
  :root[data-theme="light"] {
    --bg: #fdfcfa;
    --bg-2: #f4f3ee;
    --ink: #3a382f;
    --muted: #7d7b74;
    --faint: #aeaca4;
    --border-strong: #d8d6d0;
    --hover: rgb(58 56 47 / 0.06);
    --accent: #3f8f63;
    --accent-text: #357953;
    --ok: #3f8f63;
    --run: #d98232;
    --fail: #c65346;
    color-scheme: light;
  }

  html { -webkit-font-smoothing: antialiased; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.65;
    margin: 0;
  }

  /* ---- study chrome ---- */
  .study {
    position: sticky;
    top: 0;
    z-index: 10;
    background: var(--bg);
    padding: 14px 20px 10px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 8px 16px;
  }
  .study h1 {
    font-size: 13px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0;
    margin-right: auto;
  }
  .tabs { display: flex; flex-wrap: wrap; gap: 2px; background: var(--bg-2); border-radius: 8px; padding: 3px; }
  .tabs button {
    font: 500 13px/1.4 var(--sans);
    color: var(--muted);
    background: transparent;
    border: 0;
    border-radius: 6px;
    padding: 4px 11px;
    cursor: pointer;
  }
  .tabs button:hover { color: var(--ink); }
  .tabs button[aria-selected="true"] { background: var(--bg); color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgb(15 15 15 / 0.06); }
  .tabs button:focus-visible, .theme button:focus-visible, [tabindex="0"]:focus-visible,
  .glyphs button:focus-visible, .more:focus-visible, .action:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .tabs .k { color: var(--faint); font-weight: 400; margin-right: 5px; }
  .theme button {
    font: 500 12px/1 var(--sans);
    background: transparent;
    color: var(--faint);
    border: 0;
    border-radius: 6px;
    padding: 6px 8px;
    cursor: pointer;
  }
  .theme button:hover { color: var(--ink); }

  .caption {
    max-width: 680px;
    margin: 4px auto 0;
    padding: 0 24px;
    text-align: center;
    font-size: 14px;
    color: var(--muted);
  }
  .caption strong { color: var(--ink); font-weight: 600; }

  /* ---- app replica ---- */
  .screen { display: none; padding: 28px 24px 96px; }
  .screen.active { display: block; }

  .masthead { display: flex; flex-wrap: wrap; justify-content: center; align-items: baseline; margin-bottom: 40px; }
  .masthead a {
    font-size: 12px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase;
    text-decoration: none; color: var(--faint); padding: 4px 8px; border-radius: 6px; white-space: nowrap;
  }
  .masthead a:hover { color: var(--muted); }
  .masthead a.active { color: var(--ink); font-weight: 600; }

  .sheet { max-width: 672px; margin: 0 auto; }

  .glyphs { display: flex; justify-content: flex-end; margin: 0 -8px 4px 0; }
  .glyphs button {
    background: transparent; border: 0; border-radius: 6px;
    width: 32px; height: 32px; display: grid; place-items: center;
    color: var(--faint); cursor: pointer;
  }
  .glyphs button:hover { background: var(--hover); color: var(--ink); }
  .glyphs svg { width: 18px; height: 18px; }

  .chapter { font-size: 16px; font-weight: 500; color: var(--faint); margin: 28px 0 2px; }

  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .dot.ok { background: var(--ok); }
  .dot.fail { background: var(--fail); }
  .dot.run { background: var(--run); animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) { .dot.run { animation: none; } }

  .meta { flex: none; font-size: 14px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  .meta .cost { color: var(--faint); }
  .fail-text { color: var(--fail); }
  .run-text { color: var(--run); }

  /* rows */
  .entry { margin: 0 -12px; border-radius: 8px; }
  .entry .rowline { display: flex; align-items: baseline; gap: 16px; padding: 12px 4px 14px 12px; cursor: pointer; border-radius: 8px; }
  .entry:hover, .entry.open { background: var(--hover); }
  .entry .rowline .dot { align-self: center; }
  .entry .title {
    min-width: 0; flex: 1;
    font-size: 16px; font-weight: 600; color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .entry:hover .title { color: var(--accent-text); }
  .entry.read .title { font-weight: 400; color: var(--muted); }
  .more {
    flex: none; align-self: center;
    background: transparent; border: 0; border-radius: 6px;
    min-width: 32px; min-height: 24px; display: grid; place-items: center;
    color: var(--faint); cursor: pointer; font: 600 14px/1 var(--sans); letter-spacing: 1px;
  }
  .more:hover { color: var(--ink); }
  .excerpt {
    margin: -10px 12px 0 36px; padding-bottom: 14px;
    font-family: var(--serif); font-size: 15px; color: var(--ink);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    cursor: pointer;
  }
  .entry.read .excerpt { color: var(--faint); -webkit-line-clamp: 1; }
  .excerpt.error { font-family: var(--sans); font-size: 14px; color: var(--fail); }

  /* now well */
  .now-card { background: var(--bg-2); border-radius: 10px; padding: 14px 18px; margin-bottom: 10px; cursor: pointer; }
  .now-card .top { display: flex; align-items: center; gap: 12px; }
  .now-card .title { flex: 1; font-size: 16px; font-weight: 500; color: var(--ink); }
  .now-card .state { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .now-card .sub { margin: 3px 0 0 20px; font-size: 14px; color: var(--muted); }
  .now-card .sub a { color: var(--accent-text); text-decoration: none; font-weight: 500; }
  .now-card .sub a:hover { text-decoration: underline; }
  .progress { height: 3px; border-radius: 2px; background: var(--hover); margin: 12px 0 2px 20px; overflow: hidden; }
  .progress i { display: block; height: 100%; width: 30%; border-radius: 2px; background: var(--run); }

  .next-line { margin-top: 40px; text-align: center; font-size: 13px; color: var(--faint); }

  /* the unfolded document */
  .unfold { padding: 2px 16px 20px 36px; }
  .doc { line-height: 1.75; max-width: 62ch; font-size: 15px; }
  .doc h2 { font-size: 20px; font-weight: 700; letter-spacing: -0.018em; line-height: 1.25; margin: 6px 0 12px; text-wrap: balance; }
  .doc p { margin: 12px 0; color: color-mix(in srgb, var(--ink) 92%, transparent); }
  .doc p.err { color: var(--fail); }
  .doc ul { margin: 12px 0; padding-left: 24px; }
  .doc li { margin: 5px 0; padding-left: 4px; }
  .doc li::marker { color: color-mix(in srgb, var(--accent) 70%, var(--ink)); }

  /* v1 colophon */
  .colophon { margin-top: 18px; font-size: 13px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .colophon a { color: var(--accent-text); text-decoration: none; font-weight: 500; }
  .colophon a:hover { text-decoration: underline; }
  .colophon .sep { padding: 0 7px; }

  /* v2 receipt block */
  .receipt { margin-top: 18px; max-width: 62ch; }
  .file {
    display: flex; align-items: center; gap: 10px;
    padding: 7px 10px; margin: 0 -10px; border-radius: 6px;
    font-size: 14px; color: var(--ink); font-weight: 500; cursor: pointer; text-decoration: none;
  }
  .file:hover { background: var(--hover); color: var(--accent-text); }
  .file svg { width: 15px; height: 15px; color: var(--faint); flex: none; }
  .file .size { margin-left: auto; font-size: 13px; color: var(--faint); font-weight: 400; font-variant-numeric: tabular-nums; }
  .stats-line { display: flex; flex-wrap: wrap; gap: 4px 24px; margin-top: 12px; font-size: 13px; color: var(--faint); font-variant-numeric: tabular-nums; }
  .stats-line b { display: block; font-size: 14px; font-weight: 500; color: var(--muted); }

  /* v3 ledger (actions line, tasks-page style) */
  .ledger { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 4px; padding: 0 16px 14px 32px; }
  .action {
    display: inline-flex; align-items: center; gap: 8px;
    background: transparent; border: 0; border-radius: 6px;
    padding: 6px 10px; font: 400 14px/1.4 var(--sans); color: var(--muted);
    cursor: pointer; text-decoration: none;
  }
  .action:hover { background: var(--hover); color: var(--ink); }
  .action svg { width: 14px; height: 14px; flex: none; }
  .ledger .tail { margin-left: auto; font-size: 13px; color: var(--faint); font-variant-numeric: tabular-nums; padding-right: 4px; }

  @media (max-width: 560px) {
    .meta .drop { display: none; }
    .ledger .tail { margin-left: 0; flex-basis: 100%; padding: 4px 10px 0; }
  }
</style>

<header class="study">
  <h1>Runs unfold — the receipt</h1>
  <div class="tabs" role="tablist" id="tabs"></div>
  <span class="theme">
    <button type="button" data-set="light" aria-label="Light theme">light</button>
    <button type="button" data-set="dark" aria-label="Dark theme">dark</button>
    <button type="button" data-set="" aria-label="System theme">system</button>
  </span>
</header>
<p class="caption" id="caption"></p>

<section class="screen" id="v1" data-name="Colophon"
  data-caption="<strong>The colophon.</strong> Every row ends in an always-visible ⋯; the whole row (⋯ included) unfolds the document. Beneath the document, one faint line — duration · tokens · cost — with attachments as links in the same sentence. Pure typography, no furniture.">
</section>

<section class="screen" id="v2" data-name="Receipt"
  data-caption="<strong>The receipt.</strong> Same unfold, but attachments are first-class: quiet file rows with a paperclip and size under the document, then a small stat set — duration, tokens, cost — before the actions. For when the artifacts a run produces matter as much as its words.">
</section>

<section class="screen" id="v3" data-name="Two doors"
  data-caption="<strong>Two doors.</strong> The row unfolds the document; the ⋯ unfolds the tasks-page ledger instead — Run again · Open run · attachments — with the stats as the line&rsquo;s faint tail. And an experiment: the collapsed meta carries the cost, so the list doubles as a spend ledger.">
</section>

<script>
  /* ---------------- data ---------------- */
  const NOW = [
    { icon: "run", title: "Demo: Morning Brief", state: "3rd pass · started 7:30 am", progress: true },
    { icon: "run", title: "Assessor search digest", state: "waiting on you",
      sub: 'Wants to email two property owners — <a href="#" onclick="return false">review &amp; approve</a>' }
  ];

  const RUNS = [
    {
      id: "trending-today", day: "Today", task: "Google Trending Terms",
      status: "ok", metaHtml: "10:02 am", unread: true,
      duration: "2m 41s", tokens: "48.2k tokens", cost: "$0.14",
      attachments: [
        { name: "trending-terms.csv", size: "12 KB" },
        { name: "heat-dome-chart.png", size: "84 KB" }
      ],
      peek: "Searches for “heat dome forecast” jumped 340% overnight across the Pacific Northwest, led by Pierce and King counties…",
      doc: `<h2>Heat dome searches jump 340% across the Northwest</h2>
        <p>Searches for “heat dome forecast” jumped 340% overnight across the Pacific Northwest, led by Pierce and King counties. The rise tracks the National Weather Service’s excessive-heat watch issued at 4:15 pm yesterday.</p>
        <p>Related risers since Sunday:</p>
        <ul>
          <li>“portable AC in stock” — up 230%, concentrated in Tacoma and Federal Way</li>
          <li>“cooling centers near me” — up 210%, strongest in the evenings</li>
          <li>“ferry schedule changes” — holding at last week’s +80%</li>
        </ul>
        <p>Nothing else moved more than 40%. Yesterday’s riser, ferry schedules, is cooling; the Kitsap County announcement that drove it has been fully absorbed into normal search volume.</p>`
    },
    {
      id: "tacoma-today", day: "Today", task: "Tacoma Cement Plant Watch",
      status: "fail", metaHtml: '<span class="fail-text">failed</span> 9:01 am', unread: true, error: true,
      duration: "1m 33s", tokens: "11.8k tokens", cost: "$0.04",
      attachments: [],
      peek: "County permit portal timed out after three attempts — no document check completed.",
      doc: `<h2>Run failed — permit portal unreachable</h2>
        <p class="err">The Pierce County permit portal timed out after three attempts (30s each). No document check was completed this morning.</p>
        <p>The portal responded normally at yesterday’s check, so this looks like an outage on their side rather than a page change. The last successful check was yesterday, 9:03 am; nothing new had been filed as of then.</p>
        <p>Next scheduled attempt: tomorrow, 9:00 am. Run it again sooner from the task page if the portal comes back today.</p>`
    },
    {
      id: "assessor-today", day: "Today", task: "Assessor search digest",
      status: "ok", metaHtml: "8:12 am", unread: false,
      duration: "4m 05s", tokens: "96.7k tokens", cost: "$0.31",
      attachments: [
        { name: "matched-parcels.csv", size: "4 KB" },
        { name: "east-64th-record.pdf", size: "310 KB" },
        { name: "portland-ave-record.pdf", size: "288 KB" }
      ],
      peek: "Two new parcels matched your saved search this week: a 1.2-acre lot on East 64th…",
      doc: `<h2>Two new parcels match your saved search</h2>
        <p>Two parcels appeared in this week’s assessor updates that match your criteria (≥ 0.5 acre, R2 zoning, east side):</p>
        <ul>
          <li><b>1.2-acre lot, East 64th St</b> — assessed at $148k, down 6% from last year. No structures on record.</li>
          <li><b>Duplex near Portland Ave</b> — 0.6 acre, assessed $412k. Ownership transferred in June; first appearance under the new LLC.</li>
        </ul>
        <p>Neither parcel shows an active listing yet. Both are saved to the tracking sheet with links to the assessor records.</p>`
    },
    {
      id: "trending-yesterday", day: "Yesterday", task: "Google Trending Terms",
      status: "ok", metaHtml: "10:02 am", unread: false,
      duration: "2m 12s", tokens: "41.5k tokens", cost: "$0.12",
      attachments: [{ name: "trending-terms.csv", size: "9 KB" }],
      peek: "A quiet news day: the only notable riser was “ferry schedule changes,” up 80%…",
      doc: `<h2>A quiet day — ferries are the only riser</h2>
        <p>A quiet news day across the region. The only notable riser was “ferry schedule changes,” up 80% in Kitsap County after the transit authority’s fall-schedule announcement.</p>
        <p>Everything else in your watched set moved less than 25%, which is inside normal daily noise.</p>`
    },
    {
      id: "tacoma-yesterday", day: "Yesterday", task: "Tacoma Cement Plant Watch",
      status: "ok", metaHtml: "9:03 am", unread: false,
      duration: "6m 48s", tokens: "132.4k tokens", cost: "$0.42",
      attachments: [{ name: "variance-comments.pdf", size: "1.1 MB" }],
      peek: "No new filings today. The air-quality variance request from July 8 remains open…",
      doc: `<h2>No new filings; variance request still open</h2>
        <p>No new documents were filed on the plant today. The air-quality variance request from July 8 remains open, with public comments due July 22.</p>
        <p>The comment count on the request rose from 14 to 31 since yesterday — the biggest single-day jump so far, most citing dust complaints from the Eastside neighborhood.</p>`
    },
    {
      id: "brief-yesterday", day: "Yesterday", task: "Demo: Morning Brief",
      status: "ok", metaHtml: "7:34 am", unread: false,
      duration: "3m 02s", tokens: "27.9k tokens", cost: "$0.09",
      attachments: [],
      peek: "Good morning. Partly sunny, high of 78. Two meetings today…",
      doc: `<h2>Tuesday briefing</h2>
        <p>Good morning. Partly sunny, high of 78, light breeze off the Sound in the afternoon.</p>
        <p>Two meetings today: the 10 am design review and a 2:30 call with the county records office. Nothing on the calendar after 4.</p>
        <p>Headlines worth a minute: the port commission approved the terminal expansion study, and WSDOT begins night closures on I-5 south Thursday.</p>`
    }
  ];

  /* ---------------- svg ---------------- */
  const svgSearch = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>';
  const svgClip = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>';
  const svgPlay = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="6 3 20 12 6 21 6 3"/></svg>';
  const svgOpen = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>';

  /* ---------------- render ---------------- */
  function mastheadHtml() {
    return `<nav class="masthead" aria-label="Main navigation">
      <a href="#" onclick="return false">tasks</a><a href="#" onclick="return false" class="active">runs</a><a href="#" onclick="return false">connect</a><a href="#" onclick="return false">integrations</a><a href="#" onclick="return false">settings</a>
    </nav>`;
  }

  function nowHtml() {
    return NOW.map((card) => `
      <div class="now-card" tabindex="0">
        <div class="top">
          <span class="dot ${card.icon}"></span>
          <span class="title">${card.title}</span>
          <span class="state">${card.state}</span>
        </div>
        ${card.progress ? '<div class="progress" aria-hidden="true"><i></i></div>' : ""}
        ${card.sub ? `<p class="sub">${card.sub}</p>` : ""}
      </div>`).join("");
  }

  function attachmentsInline(run) {
    if (!run.attachments.length) return "";
    return '<span class="sep">·</span>' +
      run.attachments.map((file) => `<a href="#" onclick="return false">${file.name}</a>`).join('<span class="sep">·</span>');
  }

  function unfoldHtml(run, variant) {
    let footer = "";
    if (variant === "colophon") {
      footer = `<div class="colophon">${run.duration}<span class="sep">·</span>${run.tokens}<span class="sep">·</span>${run.cost}${attachmentsInline(run)}<span class="sep">·</span><a href="#" onclick="return false">open run ↗</a></div>`;
    }
    if (variant === "receipt") {
      const files = run.attachments.map((file) => `
        <a class="file" href="#" onclick="return false">${svgClip}<span>${file.name}</span><span class="size">${file.size}</span></a>`).join("");
      footer = `<div class="receipt">
        ${files}
        <div class="stats-line">
          <span><b>${run.duration}</b>duration</span>
          <span><b>${run.tokens.replace(" tokens", "")}</b>tokens</span>
          <span><b>${run.cost}</b>cost</span>
          <span style="margin-left:auto; align-self:end;"><a class="file" style="margin:0; padding:4px 8px;" href="#" onclick="return false">${svgOpen}<span>open run</span></a></span>
        </div>
      </div>`;
    }
    return `<div class="unfold"><div class="doc">${run.doc}</div>${footer}</div>`;
  }

  function ledgerHtml(run) {
    const files = run.attachments.map((file) => `
      <a class="action" href="#" onclick="return false">${svgClip}<span>${file.name}</span></a>`).join("");
    return `<div class="ledger">
      <button type="button" class="action">${svgPlay}<span>Run again</span></button>
      <a class="action" href="#" onclick="return false">${svgOpen}<span>Open run</span></a>
      ${files}
      <span class="tail">${run.duration} · ${run.tokens} · ${run.cost}</span>
    </div>`;
  }

  function listHtml(state, variant) {
    let html = "", day = null;
    for (const run of RUNS) {
      if (run.day !== day) { day = run.day; html += `<h2 class="chapter">${day}</h2>`; }
      const open = state.openId === run.id;
      const classes = ["entry"];
      if (!state.unread.has(run.id)) classes.push("read");
      if (open) classes.push("open");
      const showCost = variant === "twodoors" ? ` <span class="cost drop">· ${run.cost}</span>` : "";
      html += `
        <div class="${classes.join(" ")}" data-run="${run.id}">
          <div class="rowline" data-click="doc" role="button" tabindex="0" aria-expanded="${open}">
            <span class="dot ${run.status}"></span>
            <span class="title">${run.task}</span>
            <span class="meta">${run.metaHtml}${showCost}</span>
            <button type="button" class="more" data-click="${variant === "twodoors" ? "ledger" : "doc"}"
              aria-label="Details for ${run.task}">⋯</button>
          </div>
          <p class="excerpt${run.error ? " error" : ""}" data-click="doc">${run.peek}</p>
          ${open && state.openKind === "doc" ? unfoldHtml(run, variant === "receipt" ? "receipt" : "colophon") : ""}
          ${open && state.openKind === "ledger" ? ledgerHtml(run) : ""}
        </div>`;
    }
    return html;
  }

  /* ---------------- controllers ---------------- */
  function makeState() {
    return { openId: null, openKind: "doc", unread: new Set(RUNS.filter((r) => r.unread).map((r) => r.id)) };
  }
  const states = { v1: makeState(), v2: makeState(), v3: makeState() };
  const variants = { v1: "colophon", v2: "receipt", v3: "twodoors" };

  function render(screenId) {
    const state = states[screenId];
    const variant = variants[screenId];
    document.getElementById(screenId).innerHTML = `
      ${mastheadHtml()}
      <div class="sheet">
        <div class="glyphs">
          <button type="button" title="Search runs" aria-label="Search runs">${svgSearch}</button>
        </div>
        ${nowHtml()}
        ${listHtml(state, variant)}
        <p class="next-line">Next: Tacoma Cement Plant Watch · tomorrow 9:00 am</p>
      </div>`;
    wire(screenId);
  }

  function wire(screenId) {
    const state = states[screenId];
    document.querySelectorAll(`#${screenId} .entry`).forEach((entry) => {
      const id = entry.dataset.run;
      entry.querySelectorAll("[data-click]").forEach((el) => {
        const kind = el.dataset.click;
        const go = (event) => {
          event.stopPropagation();
          state.unread.delete(id);
          if (state.openId === id && state.openKind === kind) {
            state.openId = null;
          } else {
            state.openId = id;
            state.openKind = kind;
          }
          render(screenId);
        };
        el.addEventListener("click", go);
        if (el.classList.contains("rowline")) {
          el.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") { event.preventDefault(); go(event); }
          });
        }
      });
    });
  }

  /* ---------------- study shell ---------------- */
  const screens = [...document.querySelectorAll(".screen")];
  const tabs = document.getElementById("tabs");
  const caption = document.getElementById("caption");

  screens.forEach((screen, index) => {
    const button = document.createElement("button");
    button.type = "button";
    button.setAttribute("role", "tab");
    button.innerHTML = `<span class="k">${index + 1}</span>${screen.dataset.name}`;
    button.addEventListener("click", () => select(index));
    tabs.appendChild(button);
  });

  let current = 0;
  function select(index) {
    current = index;
    screens.forEach((screen, i) => screen.classList.toggle("active", i === index));
    [...tabs.children].forEach((button, i) =>
      button.setAttribute("aria-selected", i === index ? "true" : "false"));
    caption.innerHTML = screens[index].dataset.caption;
    render(screens[index].id);
  }
  select(0);

  window.addEventListener("keydown", (event) => {
    if (event.metaKey || event.ctrlKey) return;
    const n = Number(event.key);
    if (n >= 1 && n <= screens.length) { select(n - 1); return; }
    if (event.key === "Escape") {
      const id = screens[current].id;
      if (states[id].openId) { states[id].openId = null; render(id); }
    }
  });

  document.querySelectorAll(".theme button").forEach((button) => {
    button.addEventListener("click", () => {
      const value = button.dataset.set;
      if (value) document.documentElement.dataset.theme = value;
      else delete document.documentElement.dataset.theme;
    });
  });
</script>
