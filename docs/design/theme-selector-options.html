<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Springroll · Theme selector options</title>
<style>
:root{color-scheme:dark;--bg:#1e1e1e;--fg:#dadada;--accent:#4db07a;--surface:#292929;--line:#414141;--muted:#999;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg)}button,input,summary{font:inherit}button,summary{cursor:pointer}button{color:inherit;background:none;border:0}button:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}header,main{max-width:1080px;margin:auto;padding:28px 24px}header{border-bottom:1px solid var(--line)}h1{font-size:30px;letter-spacing:-1px;margin:0 0 10px}h2{font-size:18px;margin:0 0 20px}p{font-size:13px;color:var(--muted);line-height:1.6;margin:0}.tabs,.filters{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0 12px}.tabs button{padding:9px 13px;border:1px solid var(--line);border-radius:6px;font-size:12px}.tabs button[aria-pressed=true]{color:var(--accent);border-color:var(--accent)}.shell{display:grid;grid-template-columns:165px minmax(0,1fr);gap:36px}.side{font-size:13px;color:var(--muted);display:grid;gap:4px;align-content:start}.side span{padding:10px 12px}.side .on{border-left:2px solid var(--accent);background:var(--surface);color:var(--fg)}.content{min-width:0}.label{font-size:10px;color:var(--muted);letter-spacing:1.4px;text-transform:uppercase}.filters{margin-top:0}.filters button{font-size:12px;padding:6px 10px;color:var(--muted)}.filters button[aria-pressed=true]{color:var(--fg);background:var(--surface);border-radius:5px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.theme{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid transparent;border-radius:7px;text-align:left;min-width:0;background:var(--surface)}.theme[aria-pressed=true]{border-color:var(--accent)}.theme[aria-pressed=true] .name:after{content:' ✓';color:var(--accent)}.theme:hover{background:#333}.name{font-size:12px;line-height:1.4;min-width:0}.name small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.swatches{display:flex;flex:none;width:48px;height:28px;border-radius:5px;overflow:hidden;outline:1px solid #ffffff22}.swatches i{flex:1;background:var(--c)}.grid .theme{flex-direction:column;align-items:start;gap:9px}.grid .swatches{width:100%;height:24px}.list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px}.list .theme{border-radius:0;border:0;border-bottom:1px solid var(--line);background:none;padding:13px 0}.list .theme[aria-pressed=true]{background:var(--surface)}.dropdown{position:relative;max-width:430px}.dropdown summary{display:flex;align-items:center;gap:12px;list-style:none;border:1px solid var(--line);padding:10px 12px;border-radius:7px;min-height:46px}.dropdown summary::-webkit-details-marker{display:none}.dropdown summary:after{content:'Change ▾';margin-left:auto;font-size:11px;color:var(--muted)}.panel{position:absolute;z-index:5;top:calc(100% + 8px);width:100%;padding:10px;background:var(--bg);border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 30px #0005}.panel input{width:100%;background:var(--surface);color:var(--fg);border:0;padding:10px;border-radius:5px;font-size:13px}.results{max-height:300px;overflow:auto;margin-top:8px}.results .theme{width:100%;background:none}.foot{margin-top:24px;border-top:1px solid var(--line);padding-top:18px;font-size:12px;color:var(--muted)}.size{display:flex;gap:6px;margin:14px 0 26px}.size button{padding:7px 12px;border-radius:5px;background:var(--surface);font-size:12px}.size button[aria-pressed=true]{outline:1px solid var(--accent)}.selection{display:flex;gap:16px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:20px;margin-top:30px}.selection button{border:1px solid var(--accent);color:var(--accent);padding:9px 12px;border-radius:6px;font-size:12px}#notes{max-width:760px;min-height:42px}@media(max-width:750px){.shell{grid-template-columns:1fr}.side{display:none}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.list{grid-template-columns:1fr}}
/* The background is the primary swatch; supporting colors sit inside it. */
.swatches{position:relative;width:58px;height:36px;background:var(--theme-bg);outline:1px solid color-mix(in srgb,var(--theme-fg) 18%,var(--theme-bg));padding:7px;gap:3px;align-items:flex-end}
.swatches i{flex:none;width:7px;height:7px;border-radius:50%;background:var(--c)}
.grid .swatches{height:78px;padding:12px;gap:5px;border-radius:6px}
.grid .swatches i{width:11px;height:11px}
.grid .theme{padding:8px;gap:9px;background:transparent}
.grid .theme:hover{background:var(--surface)}
.grid .name{padding:0 3px 3px}
.grid .swatches::before{content:'Aa';position:absolute;top:10px;left:12px;color:var(--theme-fg);font-size:16px;font-weight:600;letter-spacing:-.4px}
.list .swatches,.dropdown .swatches{border-radius:5px}
</style></head><body>
<header><h1>Theme selector options.</h1><p>Same existing themes. Smaller controls, fewer preview cards.</p><nav class="tabs" aria-label="Design options"><button data-option="grid" aria-pressed="true">A · Swatch grid</button><button data-option="dropdown" aria-pressed="false">B · Searchable dropdown</button><button data-option="list" aria-pressed="false">C · Compact list</button></nav><p id="notes"></p></header>
<main><div class="shell"><aside class="side"><span>Models & limits</span><span>AI providers</span><span>Web researcher</span><span>Images</span><span class="on">Appearance</span></aside><section class="content"><h2>Theme</h2><div id="picker"></div><p class="foot" id="current"></p><div style="margin-top:28px"><span class="label">Text size</span><div class="size"><button aria-pressed="false">Small</button><button aria-pressed="true">Default</button><button aria-pressed="false">Large</button></div></div><p>Selection is simulated here; the preview page and your app theme do not change.</p><div class="selection"><button id="choose">Choose option A</button><p id="feedback" role="status">Pick the selector design, not a new theme.</p></div></section></div></main>
<script>
const themes=[{"id":"system","name":"System","group":"System","colors":{"bg":"#FFFFFF","fg":"#222222","accent":"#357953","run":"#D98232","ok":"#08B94E","warn":"#E0AC00","danger":"#E93147","chartSeries":["#357953","#D98232","#3978C6","#8B5CB5","#21858C","#BE587C","#E0AC00","#E93147"]}},{"id":"springroll-light","name":"Springroll Light","group":"Light","colors":{"bg":"#FFFFFF","fg":"#222222","accent":"#357953","run":"#D98232","ok":"#08B94E","warn":"#E0AC00","danger":"#E93147","chartSeries":["#357953","#D98232","#3978C6","#8B5CB5","#21858C","#BE587C","#E0AC00","#E93147"]}},{"id":"springroll-dark","name":"Springroll Dark","group":"Dark","colors":{"bg":"#1E1E1E","fg":"#DADADA","accent":"#4db07a","run":"#E0934F","ok":"#08B94E","warn":"#E0AC00","danger":"#E93147","chartSeries":["#4DB07A","#E0934F","#79ACEE","#B99ADD","#67C2C9","#E58FAA","#E0AC00","#E93147"]}},{"id":"catppuccin-mocha","name":"Catppuccin Mocha","group":"Dark","colors":{"bg":"#1E1E2E","fg":"#CDD6F4","accent":"#CBA6F7","run":"#FAB387","ok":"#A6E3A1","warn":"#F9E2AF","danger":"#F38BA8"}},{"id":"nightfox","name":"Nightfox","group":"Dark","colors":{"bg":"#192330","fg":"#CDCECF","accent":"#719CD6","run":"#F4A261","ok":"#81B29A","warn":"#DBC074","danger":"#C94F6D"}},{"id":"tokyo-night","name":"Tokyo Night","group":"Dark","colors":{"bg":"#1A1B26","fg":"#C0CAF5","accent":"#7AA2F7","run":"#FF9E64","ok":"#9ECE6A","warn":"#E0AF68","danger":"#F7768E"}},{"id":"dracula","name":"Dracula","group":"Dark","colors":{"bg":"#282A36","fg":"#F8F8F2","accent":"#BD93F9","run":"#FFB86C","ok":"#50FA7B","warn":"#F1FA8C","danger":"#FF5555"}},{"id":"kanagawa","name":"Kanagawa","group":"Dark","colors":{"bg":"#1F1F28","fg":"#DCD7BA","accent":"#7E9CD8","run":"#FFA066","ok":"#98BB6C","warn":"#E6C384","danger":"#FF5D62"}},{"id":"carbonfox","name":"Carbonfox","group":"Dark","colors":{"bg":"#161616","fg":"#F2F4F8","accent":"#78A9FF","run":"#FF832B","ok":"#25BE6A","warn":"#FDDC69","danger":"#EE5396"}},{"id":"jellybeans","name":"Jellybeans","group":"Dark","colors":{"bg":"#151515","fg":"#E8E8D3","accent":"#8197BF","run":"#FFB964","ok":"#99AD6A","warn":"#FAD07A","danger":"#CF6A4C"}},{"id":"catppuccin-latte","name":"Catppuccin Latte","group":"Light","colors":{"bg":"#EFF1F5","fg":"#4C4F69","accent":"#8839EF","run":"#FE640B","ok":"#40A02B","warn":"#DF8E1D","danger":"#D20F39"}},{"id":"dayfox","name":"Dayfox","group":"Light","colors":{"bg":"#F6F2EE","fg":"#3D2B5A","accent":"#2848A9","run":"#955F61","ok":"#396847","warn":"#AC5402","danger":"#A5222F"}},{"id":"tokyo-day","name":"Tokyo Day","group":"Light","colors":{"bg":"#E1E2E7","fg":"#33549E","accent":"#2E7DE9","run":"#B15C00","ok":"#587539","warn":"#8C6C3E","danger":"#F52A65"}},{"id":"solarized","name":"Solarized","group":"Light","colors":{"bg":"#FDF6E3","fg":"#4E6269","accent":"#268BD2","run":"#CB4B16","ok":"#859900","warn":"#B58900","danger":"#DC322F"}},{"id":"github-light","name":"GitHub Light","group":"Light","colors":{"bg":"#FFFFFF","fg":"#24292F","accent":"#0969DA","run":"#BC4C00","ok":"#1A7F37","warn":"#9A6700","danger":"#CF222E"}},{"id":"catppuccin-glass","name":"Catppuccin Glass","group":"Glass","colors":{"bg":"#11111B","fg":"#CDD6F4","accent":"#CBA6F7","run":"#FAB387","ok":"#A6E3A1","warn":"#F9E2AF","danger":"#F38BA8"}},{"id":"springroll-dark-glass","name":"Springroll Dark Glass","group":"Glass","colors":{"bg":"#101010","fg":"#DADADA","accent":"#4db07a","run":"#E0934F","ok":"#08B94E","warn":"#E0AC00","danger":"#E93147","chartSeries":["#4DB07A","#E0934F","#79ACEE","#B99ADD","#67C2C9","#E58FAA","#E0AC00","#E93147"]}},{"id":"nightfox-glass","name":"Nightfox Glass","group":"Glass","colors":{"bg":"#0F151E","fg":"#CDCECF","accent":"#719CD6","run":"#F4A261","ok":"#81B29A","warn":"#DBC074","danger":"#C94F6D"}}];
let mode='grid',group='Dark',selected='springroll-dark';
const notes={grid:'A · My recommendation. Small swatch tiles show each palette at a glance. Category filters replace the large horizontal preview rails.',dropdown:'B · Most compact. One outlined field, with theme swatches and search inside the popup. Best if changing themes is infrequent.',list:'C · Name-first. A tidy two-column list with small swatches and a selected checkmark. Easier to scan names, less visual than the grid.'};
const picker=document.getElementById('picker');
function swatches(t){return '<span class="swatches" aria-hidden="true" style="--theme-bg:'+t.colors.bg+';--theme-fg:'+t.colors.fg+'">'+[t.colors.accent,t.colors.run,t.colors.ok,t.colors.warn,t.colors.danger].map(c=>'<i style="--c:'+c+'"></i>').join('')+'</span>';}
function item(t){return '<button class="theme" data-id="'+t.id+'" aria-pressed="'+(selected===t.id)+'">'+swatches(t)+'<span class="name">'+t.name+'<small>'+t.group+'</small></span></button>';}
function filtered(){return themes.filter(t=>group==='All'||t.group===group);}
function render(){document.querySelectorAll('[data-option]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.option===mode)));document.getElementById('notes').textContent=notes[mode];const t=themes.find(t=>t.id===selected);if(mode==='dropdown'){picker.innerHTML='<details class="dropdown"><summary aria-label="Choose theme">'+swatches(t)+'<span class="name">'+t.name+'</span></summary><div class="panel"><input aria-label="Search themes" placeholder="Search '+themes.length+' themes"><div class="results">'+themes.map(item).join('')+'</div></div></details>';picker.querySelector('input').addEventListener('input',event=>{picker.querySelector('.results').innerHTML=themes.filter(t=>(t.name+' '+t.group).toLowerCase().includes(event.target.value.toLowerCase())).map(item).join('')||'<p style="padding:12px">No matching themes</p>';});}else{picker.innerHTML='<nav class="filters" aria-label="Theme category">'+['System','Light','Dark','Glass','All'].map(g=>'<button data-group="'+g+'" aria-pressed="'+(g===group)+'">'+g+'</button>').join('')+'</nav><div class="'+mode+'">'+filtered().map(item).join('')+'</div>';}document.getElementById('current').textContent='Selected: '+t.name;document.getElementById('choose').textContent='Choose option '+({grid:'A',dropdown:'B',list:'C'}[mode]);}
document.querySelectorAll('[data-option]').forEach(b=>b.addEventListener('click',()=>{mode=b.dataset.option;render();}));
picker.addEventListener('click',event=>{const g=event.target.closest('[data-group]');const t=event.target.closest('[data-id]');if(g){group=g.dataset.group;render();}if(t){selected=t.dataset.id;render();}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'){const d=picker.querySelector('details');if(d){d.open=false;d.querySelector('summary').focus();}}});
document.addEventListener('click',event=>{const d=picker.querySelector('details');if(d&&!d.contains(event.target))d.open=false;});
document.querySelectorAll('.size button').forEach(b=>b.addEventListener('click',()=>document.querySelectorAll('.size button').forEach(other=>other.setAttribute('aria-pressed',String(other===b)))));
document.getElementById('choose').addEventListener('click',()=>document.getElementById('feedback').textContent='Selected option '+({grid:'A',dropdown:'B',list:'C'}[mode])+'. Tell me this letter in chat to implement it.');
render();
</script></body></html>
