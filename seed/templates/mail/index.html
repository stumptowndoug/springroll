<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mail</title>
<link rel="stylesheet" href="/ui/theme.css">
<script src="/ui/desk.js"></script>
<style>
[hidden] { display: none !important; }
/* Layout only; every look comes from the kit. */
.ui-split { --split: 380px; }
#search { flex: 0 1 280px; }
:where(#listpane, #detail) { display: flex; flex-direction: column; }  /* :where keeps the kit's phone hide rule winning */
#status { display: flex; align-items: center; gap: 8px; padding: 8px var(--row-px); font-size: var(--text-xs); }
#items .sub + .sub { color: var(--faint); }
#items .meta { display: flex; align-items: center; gap: 4px; }
#items .meta .acct { margin-right: 4px; max-width: 9em; overflow: hidden; text-overflow: ellipsis; }
#acct { width: auto; max-width: 240px; height: calc(var(--ctl-h) - 6px); margin-left: 6px; }
#status a { color: var(--link); }
#more { margin: var(--gap) auto; }
.skel-row { display: flex; gap: 12px; padding: var(--row-py) var(--row-px); align-items: center; }
.skel-row > .ui-skeleton:first-child { width: 24px; height: 24px; border-radius: 50%; flex: none; }
.skel-row > div { flex: 1; display: grid; gap: 6px; }

#detail { overflow: hidden; }
#detail > .ui-empty { flex: none; }
#back { display: none; }
#head { padding: var(--pad) var(--pad) var(--gap); display: grid; gap: var(--gap); flex: none; }
#head .from { display: flex; gap: 10px; align-items: center; min-width: 0; font-size: var(--text-sm); }
#head .from > div { min-width: 0; }
#head .addrs { word-break: break-word; }
#atts { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: var(--text-sm); }

/* Sandboxed mail body. The mail keeps its own colors inside the frame; in dark
   themes the server inverts HTML mail (frame/?dark=1) and the lighten blend
   below lifts its blacks to the theme background. */
#view { flex: 1; display: flex; min-height: 0; position: relative; background: var(--surface-recessed); padding: var(--gap); }
#view iframe { flex: 1; border: 0; width: 100%; border-radius: var(--radius-sm); }
#view.dark { background: var(--bg); }
#view.dark::after { content: ""; position: absolute; inset: 0; background: var(--bg); mix-blend-mode: lighten; pointer-events: none; }

/* Today: the triage job's verdicts */
#tabs .ui-badge { margin-left: 6px; }
.today-sec { margin-top: 36px; }
.today-sec > header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.mail-need { display: grid; gap: 4px; padding: 16px 18px; }
.mail-need .who { display: flex; align-items: baseline; gap: 10px; }
.mail-need .who b { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mail-need .subj { font-weight: 550; }
.mail-need .why { color: var(--muted); font-size: var(--text-sm); }
.mail-need .act { font-size: var(--text-sm); }
.mail-need details { margin-top: 6px; font-size: var(--text-sm); }
.mail-need details summary { cursor: pointer; color: var(--muted); width: fit-content; }
.mail-need .draft { margin-top: 8px; padding: 10px 14px; border-radius: var(--radius-sm); background: var(--bg); white-space: pre-wrap; line-height: 1.5; }
.mail-need .acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; align-items: center; }
.mail-row .body .sub { white-space: normal; }
.filed { display: flex; flex-wrap: wrap; gap: 8px; }
.move { width: auto; height: calc(var(--ctl-h) - 8px); font-size: var(--text-xs); padding: 0 26px 0 10px; color: var(--muted); }
#today .ui-heading { margin-bottom: 8px; }
.today-note { color: var(--muted); font-size: var(--text-sm); }

@media (max-width: 720px) {
  #back { display: inline-flex; }
  body:has(.show-detail) > .ui-toolbar { display: none; }
  #view { padding: 0; }
  #view iframe { border-radius: 0; }
  #search { flex: 1 1 auto; }
}
</style></head>
<body class="ui-app">
<div class="ui-toolbar">
  <div class="ui-seg" id="tabs" role="tablist"><button data-tab="today" aria-pressed="true">Today</button><button data-tab="inbox" aria-pressed="false">Inbox <span class="ui-badge" id="unread" hidden></span></button></div>
  <select id="acct" class="ui-select" hidden aria-label="Account"></select>
  <div class="ui-spacer"></div>
  <div class="ui-search" id="search"><i data-icon="search" data-icon-size="sm"></i><input id="q" type="search" placeholder="Search mail" autocomplete="off"></div>
</div>
<main id="today" class="ui-fill"><div class="ui-page narrow" id="todayIn"></div></main>
<div class="ui-split" id="split" hidden>
  <section id="listpane">
    <div id="status" class="ui-muted"></div>
    <div class="ui-list" id="items"></div>
  </section>
  <section id="detail">
    <div class="ui-empty" id="ph"><i data-icon="mail"></i><span class="title">No message selected</span><p>Pick a message from the list to read it.</p></div>
    <div class="ui-toolbar" id="bar" hidden>
      <button id="back" class="ui-btn ghost" data-icon="arrow-left">Inbox</button>
      <div class="ui-spacer"></div>
      <button id="imgs" class="ui-btn ghost sm" hidden></button>
      <button id="tone" class="ui-btn ghost sm" hidden></button>
    </div>
    <div id="head" hidden></div>
    <div id="view" hidden><iframe id="fr" sandbox="allow-popups allow-popups-to-escape-sandbox" title="Message"></iframe></div>
  </section>
</div>
<script>
const $ = (id) => document.getElementById(id);
let items = [], cur = null, curMsg = null, term = '', loading = false, done = false, images = false, darkOn = true, openSeq = 0;
let account = '', accounts = []; // several Gmail accounts: one inbox, or one account at a time
const acctTag = (m) => (accounts.length > 1 && !account ? `<span class="acct ui-faint">${esc(m.account.split('@')[0])}</span>` : '');
const esc = (s = '') => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const sender = (m) => m.from_name || m.from_addr || '?';
function fmt(t) {
  const d = new Date(t * 1000), n = new Date();
  if (d.toDateString() === n.toDateString()) return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  if (d.getFullYear() === n.getFullYear()) return d.toLocaleDateString([], { month: 'short', day: 'numeric' });
  return d.toLocaleDateString([], { year: 'numeric', month: 'short', day: 'numeric' });
}

// ---- List ----
const row = (m) => `<button class="ui-row${m.seen ? '' : ' unread'}${m.uid === cur ? ' selected' : ''}" data-uid="${m.uid}">
  <span class="ui-avatar sm" style="--hue:${ui.hue(sender(m))}">${esc(ui.initials(sender(m)))}</span>
  <div class="body"><span class="title">${esc(sender(m))}</span><span class="sub">${esc(m.subject || '(no subject)')}</span><span class="sub">${esc(m.snippet)}</span></div>
  <span class="meta">${acctTag(m)}${m.att ? ui.icon('paperclip', 'sm') : ''}${fmt(m.date)}</span></button>`;
const skeleton = (n) => Array.from({ length: n }, (_, i) =>
  `<div class="skel-row"><div class="ui-skeleton"></div><div><div class="ui-skeleton" style="width:${40 + (i * 17) % 35}%"></div><div class="ui-skeleton" style="width:${65 + (i * 13) % 30}%"></div></div></div>`).join('');
function render() {
  const el = $('items');
  if (!items.length && done) {
    el.innerHTML = term
      ? `<div class="ui-empty"><i data-icon="search-x"></i><span class="title">No matches</span><p>Nothing in the inbox matches “${esc(term)}”.</p></div>`
      : `<div class="ui-empty"><i data-icon="inbox"></i><span class="title">No mail yet</span><p>New messages appear here after the next sync.</p></div>`;
    return;
  }
  el.innerHTML = items.map(row).join('') + (!done && items.length ? '<button class="ui-btn ghost" id="more">Load more</button>' : '');
}
async function load(reset) {
  if (loading) return; loading = true;
  if (reset) { items = []; done = false; $('items').innerHTML = skeleton(8); }
  else { $('more')?.replaceWith(Object.assign(document.createElement('div'), { innerHTML: skeleton(3) })); }
  try {
    const before = items.length ? items[items.length - 1].date : 0;
    const r = await (await fetch(`api/list?q=${encodeURIComponent(term)}&before=${before}&account=${encodeURIComponent(account)}`)).json();
    items = items.concat(r.items); if (r.items.length < 60) done = true;
    render();
  } catch (e) {
    $('items').innerHTML = `<div class="ui-empty"><i data-icon="mail-x"></i><span class="title">Couldn’t load mail</span><p>The Mail server didn’t answer.</p><button class="ui-btn" onclick="load(true)" data-icon="refresh-cw">Try again</button></div>`;
  } finally { loading = false; }
}
async function status() {
  try {
    const s = await (await fetch('api/status')).json();
    let dot, t;
    const failing = (s.accounts || []).filter((a) => a.error);
    if (!s.configured) { dot = 'warn'; t = 'No Gmail account yet'; }
    else if (!s.last_sync) { dot = 'run'; t = 'First sync in progress'; }
    else {
      dot = failing.length || Date.now() / 1000 - s.last_sync > 15 * 60 ? 'warn' : 'ok';
      t = `${s.count.toLocaleString()} messages · synced ${ui.ago(s.last_sync)}${/^\d/.test(ui.ago(s.last_sync)) ? ' ago' : ''}`;
      if (failing.length) t += ` · ${failing.map((a) => a.email).join(', ')} couldn't sign in`;
    }
    $('status').innerHTML = `<span class="ui-dot ${dot}"></span><span>${esc(t)}</span>${!s.configured || failing.length ? ' <a href="#" id="toConn">Connections</a>' : ''}`;
    const tc = $('toConn'); if (tc) tc.onclick = (e) => { e.preventDefault(); desk.go('#/connections/gmail'); };
    // The account picker shows once there's more than one.
    const names = (s.accounts || []).map((a) => a.email);
    if (names.join() !== accounts.join()) {
      accounts = names;
      if (account && !names.includes(account)) { account = ''; load(true); }
      $('acct').innerHTML = `<option value="">All accounts</option>` + names.map((n) => `<option value="${esc(n)}"${n === account ? ' selected' : ''}>${esc(n)}</option>`).join('');
      $('acct').hidden = names.length < 2;
      render(); if (tab === 'today') renderToday();
    }
    $('unread').hidden = !s.unread; $('unread').textContent = s.unread.toLocaleString();
    $('unread').title = `${s.unread} unread`;
  } catch (e) {}
}

// ---- Reading pane ----
// Resolve a theme color to rrggbb for the frame endpoint (the frame can't see our CSS variables).
function hex(v) {
  const e = document.createElement('i'); e.style.color = v; document.body.appendChild(e);
  const col = getComputedStyle(e).color; e.remove();
  const c = document.createElement('canvas'); c.width = c.height = 1; const x = c.getContext('2d');
  x.fillStyle = col; x.fillRect(0, 0, 1, 1);
  return [...x.getImageData(0, 0, 1, 1).data].slice(0, 3).map((n) => n.toString(16).padStart(2, '0')).join('');
}
const isDark = () => document.documentElement.dataset.appearance === 'dark';
function setFrame(m) {
  const dark = isDark() && m.has_html && darkOn;
  $('view').classList.toggle('dark', !!dark);
  let u = `frame/${m.uid}?images=${images ? 1 : 0}&bg=${hex('var(--bg)')}`;
  if (!m.has_html) u += `&fg=${hex('var(--fg)')}`; else if (dark) u += '&dark=1';
  $('fr').src = u;
  const tone = $('tone');
  tone.hidden = !(isDark() && m.has_html);
  tone.innerHTML = ui.icon('sun-moon', 'sm') + (darkOn ? 'Original colors' : 'Dark mode');
  $('imgs').hidden = !m.has_html;
  $('imgs').innerHTML = ui.icon(images ? 'image-off' : 'image', 'sm') + (images ? 'Hide images' : 'Load images');
}
if (window.desk && desk.onTheme) desk.onTheme(() => { if (curMsg) setFrame(curMsg); });

function select(uid) {
  cur = uid;
  for (const e of document.querySelectorAll('#items .ui-row')) e.classList.toggle('selected', +e.dataset.uid === uid);
}
async function open(uid) {
  const seq = ++openSeq;
  select(uid); images = false; darkOn = true;
  $('split').classList.add('show-detail'); history.replaceState(null, '', '#' + uid);
  $('ph').hidden = true; $('bar').hidden = false; $('head').hidden = false; $('view').hidden = true;
  $('imgs').hidden = $('tone').hidden = true;
  $('head').innerHTML = '<div class="ui-skeleton" style="width:70%;height:22px"></div><div class="ui-hstack"><div class="ui-skeleton" style="width:32px;height:32px;border-radius:50%"></div><div class="ui-skeleton" style="width:40%"></div></div>';
  let m;
  try { m = await (await fetch('api/msg/' + uid)).json(); } catch (e) { m = null; }
  if (seq !== openSeq) return;
  if (!m || m.error) {
    $('head').innerHTML = '<div class="ui-empty"><i data-icon="mail-x"></i><span class="title">Message not found</span><p>It may have left the inbox since the last sync.</p></div>';
    return;
  }
  curMsg = m;
  const name = sender(m);
  $('head').innerHTML = `<h1 class="ui-title">${esc(m.subject || '(no subject)')}</h1>
    <div class="from"><span class="ui-avatar" style="--hue:${ui.hue(name)}">${esc(ui.initials(name))}</span>
      <div><div class="ui-truncate"><b>${esc(m.from_name || m.from_addr)}</b>${m.from_name ? ` <span class="ui-muted">&lt;${esc(m.from_addr)}&gt;</span>` : ''}</div>
      <div class="ui-muted addrs">${accounts.length > 1 ? `In ${esc(m.account)} · ` : ''}To ${esc(m.to_addrs || '')} · ${esc(new Date(m.date * 1000).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }))}</div></div></div>`
    + (m.attachments.length ? `<div id="atts" class="ui-muted">${ui.icon('paperclip', 'sm')}${m.attachments.map((a) => `<span class="ui-badge">${esc(a)}</span>`).join('')}<span class="ui-faint">Attachments aren’t downloaded</span></div>` : '');
  $('view').hidden = false;
  setFrame(m);
}
function back() {
  $('split').classList.remove('show-detail'); history.replaceState(null, '', '#');
}

$('items').addEventListener('click', (e) => {
  if (e.target.closest('#more')) return load();
  const it = e.target.closest('.ui-row'); if (it) open(+it.dataset.uid);
});
$('back').onclick = back;
$('imgs').onclick = () => { images = !images; if (curMsg) setFrame(curMsg); };
$('tone').onclick = () => { darkOn = !darkOn; if (curMsg) setFrame(curMsg); };
$('acct').onchange = (e) => { account = e.target.value; load(true); renderToday(); };
let tm; $('q').oninput = (e) => { clearTimeout(tm); tm = setTimeout(() => { term = e.target.value.trim(); load(true); }, 200); };
addEventListener('keydown', (e) => { if (e.key === 'Escape' && document.activeElement !== $('q')) back(); });

async function refresh() {
  try {
    const r = await (await fetch(`api/list?q=&before=0&account=${encodeURIComponent(account)}`)).json();
    if (r.items.length && (!items.length || r.items[0].uid !== items[0].uid) && $('listpane').scrollTop < 10) load(true);
  } catch (e) {}
}
// ---- Today: what the mail-triage job decided (api/today) ----
const CATS = { needs_you: 'Needs you', worth_knowing: 'Worth knowing', paper_trail: 'Paper trail', feed: 'Feed', noise: 'Noise' };
let tab = (() => { try { return localStorage.getItem('mail:tab') || 'today'; } catch { return 'today'; } })(), today = { items: [], pending: 0 }, openFiled = null, showDone = false;
function setTab(t) {
  tab = t; try { localStorage.setItem('mail:tab', t); } catch {}
  for (const b of $('tabs').children) b.setAttribute('aria-pressed', b.dataset.tab === t);
  $('today').hidden = t !== 'today'; $('split').hidden = t !== 'inbox'; $('search').hidden = t !== 'inbox';
  if (t === 'today') loadToday();
}
const gmailLink = (m) => m.msgid ? `https://mail.google.com/mail/u/${encodeURIComponent(m.account)}/#search/rfc822msgid%3A${encodeURIComponent(m.msgid.replace(/^<|>$/g, ''))}` : `https://mail.google.com/mail/u/${encodeURIComponent(m.account)}/`;
const moveSel = (m) => `<select class="ui-select move" data-move="${m.uid}" aria-label="Move to another section"><option value="">Move to…</option>${Object.entries(CATS).filter(([k]) => k !== m.category).map(([k, v]) => `<option value="${k}">${v}</option>`).join('')}</select>`;
const openDrafts = new Set(); // keep an opened draft open when the page refreshes
async function loadToday() {
  try { today = await (await fetch('api/today')).json(); } catch { today = { items: [], pending: 0, error: true }; }
  renderToday();
}
function renderToday() {
  const all = today.items.filter((m) => !account || m.account === account);
  const by = (c) => all.filter((m) => m.category === c && (showDone || !m.done));
  const need = by('needs_you'), know = by('worth_knowing'), done = all.filter((m) => m.done).length;
  const filed = ['paper_trail', 'feed', 'noise'].map((c) => [c, all.filter((m) => m.category === c)]);
  const multi = accounts.length > 1 && !account;
  const from = (m) => `${esc(sender(m))}${multi ? ` <span class="ui-faint">· ${esc(m.account)}</span>` : ''}`;
  let html = `<header class="ui-heading"><div><span class="ui-eyebrow">Sorted by an agent · last 7 days</span><h1 class="ui-display">Today.</h1></div></header>`;
  if (!today.items.length) {
    html += today.pending
      ? `<p class="today-note"><span class="ui-shimmer">Sorting ${today.pending} new email${today.pending === 1 ? '' : 's'}…</span> An agent reads the sender, subject and preview and sorts them; this fills in when it's done.</p>
         <p style="margin-top:12px"><button class="ui-btn" data-sort>Sort now</button> <a class="ui-btn quiet" href="#" data-go="#/jobs/mail-triage">The triage job</a></p>`
      : `<div class="ui-empty"><i data-icon="inbox"></i><span class="title">Nothing new</span><p>New mail is sorted by an agent as it arrives. The full inbox is under Inbox.</p></div>`;
    $('todayIn').innerHTML = html; ui.hydrate($('todayIn')); return;
  }
  html += `<p class="today-note">${need.length ? `${need.length} need${need.length === 1 ? 's' : ''} you` : 'Nothing needs you'}${know.length ? `, ${know.length} worth knowing` : ''}. ${today.pending ? `<span class="ui-shimmer">Sorting ${today.pending} more…</span>` : ''}</p>`;
  html += `<section class="today-sec"><header><span class="ui-label">Needs you</span></header>${need.length ? `<div class="ui-stack" style="gap:8px">${need.map((m) => `
    <article class="ui-card mail-need${m.done ? ' done' : ''}">
      <div class="who"><b>${from(m)}</b><span class="ui-mono ui-faint" style="font-size:var(--text-xs)">${fmt(m.date)}</span></div>
      <span class="subj">${esc(m.subject)}</span>
      <span class="why">${esc(m.reason || '')}</span>
      ${m.action ? `<span class="act">${ui.icon('arrow-right', 'sm')} ${esc(m.action)}</span>` : ''}
      ${m.draft ? `<details data-draft="${m.uid}"${openDrafts.has(m.uid) ? ' open' : ''}><summary>Draft reply</summary><div class="draft" id="d${m.uid}">${esc(m.draft)}</div></details>` : ''}
      <div class="acts">
        <button class="ui-btn sm primary" data-open="${m.uid}">Open</button>
        <a class="ui-btn sm" href="${gmailLink(m)}" target="_blank" rel="noopener">Reply in Gmail</a>
        ${m.draft ? `<button class="ui-btn sm" data-copy="${m.uid}">Copy draft</button>` : ''}
        <button class="ui-btn quiet muted" data-done="${m.uid}"${m.done ? ' data-undo="1"' : ''}>${m.done ? 'Not done' : 'Done'}</button>
        <span class="ui-spacer"></span>${moveSel(m)}
      </div></article>`).join('')}</div>` : `<p class="today-note">Nothing right now.</p>`}
    ${done && !showDone ? `<p style="margin-top:8px"><button class="ui-btn quiet muted" data-showdone>${done} done</button></p>` : ''}</section>`;
  if (know.length) html += `<section class="today-sec"><header><span class="ui-label">Worth knowing</span></header><div class="ui-group">${know.map((m) => `
    <div class="ui-row mail-row"><div class="body"><span class="title">${from(m)}</span><span class="sub">${esc(m.subject)}</span><span class="sub ui-faint">${esc(m.reason || '')}</span></div>
      <button class="ui-btn quiet" data-open="${m.uid}">Open</button>${moveSel(m)}</div>`).join('')}</div></section>`;
  html += `<section class="today-sec"><header><span class="ui-label">Filed</span></header><div class="filed">${filed.map(([c, l]) =>
    `<button class="ui-btn sm${openFiled === c ? ' primary' : ''}" data-filed="${c}"${l.length ? '' : ' disabled'}>${CATS[c]} <span class="ui-mono">${l.length}</span></button>`).join('')}</div>
    ${openFiled ? `<div class="ui-group" style="margin-top:10px">${filed.find(([c]) => c === openFiled)[1].map((m) => `
      <div class="ui-row mail-row"><div class="body"><span class="title">${from(m)}</span><span class="sub">${esc(m.subject)}</span></div>
        <span class="meta">${fmt(m.date)}</span><button class="ui-btn quiet" data-open="${m.uid}">Open</button>${moveSel(m)}</div>`).join('')}</div>` : ''}</section>`;
  ui.morph($('todayIn'), html);
}
const clearHome = (uid) => fetch('/api/agent/signals/clear', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ key: `mail:${uid}` }) }).catch(() => {});
$('today').addEventListener('click', async (e) => {
  const t = e.target.closest('[data-open],[data-done],[data-copy],[data-filed],[data-sort],[data-showdone],[data-go]');
  if (!t) return;
  if (t.dataset.go) { e.preventDefault(); return desk.go(t.dataset.go); }
  if (t.dataset.open) { setTab('inbox'); open(+t.dataset.open); clearHome(+t.dataset.open); return; }
  if (t.dataset.copy) { navigator.clipboard?.writeText($('d' + t.dataset.copy).textContent); ui.toast('Draft copied'); return; }
  if (t.dataset.filed) { openFiled = openFiled === t.dataset.filed ? null : t.dataset.filed; return renderToday(); }
  if (t.dataset.showdone !== undefined) { showDone = true; return renderToday(); }
  if (t.dataset.sort !== undefined) { t.disabled = true; try { await fetch('/api/agent/jobs/mail-triage/run', { method: 'POST' }); ui.toast('Sorting started'); } catch {} return; }
  if (t.dataset.done) {
    await fetch(`api/triage/${t.dataset.done}/done`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ undo: !!t.dataset.undo }) });
    if (!t.dataset.undo) clearHome(+t.dataset.done);
    return loadToday();
  }
});
$('today').addEventListener('toggle', (e) => { const d = e.target.closest?.('[data-draft]'); if (d) d.open ? openDrafts.add(+d.dataset.draft) : openDrafts.delete(+d.dataset.draft); }, true);
$('today').addEventListener('change', async (e) => {
  const s = e.target.closest('[data-move]');
  if (!s || !s.value) return;
  await fetch(`api/triage/${s.dataset.move}/correct`, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ category: s.value }) });
  ui.toast(`Moved to ${CATS[s.value]}. The triage job will remember.`);
  loadToday();
});
$('tabs').addEventListener('click', (e) => { const b = e.target.closest('[data-tab]'); if (b) setTab(b.dataset.tab); });
addEventListener('hashchange', () => { const h = +location.hash.slice(1); if (h && h !== cur) { setTab('inbox'); open(h); clearHome(h); } });

(async () => {
  status();
  const h = +location.hash.slice(1);
  setTab(h ? 'inbox' : tab);
  await load(true);
  if (h) { open(h); clearHome(h); }
  setInterval(() => { status(); if (tab === 'today') loadToday(); else if (!term && !cur) refresh(); }, 60000);
})();
</script></body></html>
