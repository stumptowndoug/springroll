<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Files</title>
<link rel="stylesheet" href="/ui/theme.css">
<script src="/ui/desk.js"></script>
<style>
  .ui-split { --split: 300px; }
  /* Toolbar: place, then the path as crumbs */
  .crumbs { display: flex; align-items: center; gap: 1px; min-width: 0; overflow-x: auto; scrollbar-width: none; flex: 1; }
  .crumbs > button { border: 0; background: none; color: var(--muted); font-size: var(--text-sm); font-weight: 550; padding: 4px 6px; border-radius: 7px; white-space: nowrap; }
  .crumbs > button:hover { color: var(--fg); background: var(--state-hover); }
  .crumbs > button:last-child { color: var(--fg); font-weight: 650; }
  .crumbs > .sep { color: var(--faint); display: flex; flex: none; }
  .crumbs > .sep .ui-icon { --icon: 12px; }
  .place { font-size: var(--text-sm); color: var(--fg); font-weight: 650; }
  .place .ui-icon:first-child { --icon: 14px; color: var(--muted); }

  /* The folder */
  .pane-list { display: flex; flex-direction: column; }
  .f-git { display: flex; align-items: center; gap: 8px; padding: 10px var(--row-px) 4px; font-size: var(--text-xs); color: var(--muted); }
  .f-git .ui-icon { --icon: 13px; }
  .f-list { padding: 4px 6px 24px; }
  .f-row { width: 100%; border: 0; background: none; color: inherit; border-radius: var(--radius-sm); gap: 10px; padding: calc(var(--row-py) - 4px) 10px; position: relative; }
  .f-row:hover { background: var(--state-hover); }
  .f-row.selected { background: var(--surface-selected); }
  .f-row:focus-visible { outline-offset: -2px; }
  .f-row .lead { color: var(--faint); }
  .f-row[data-type="dir"] .lead { color: var(--accent); }
  .f-row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: var(--text-sm); }
  .f-row.hidden-file .name { color: var(--muted); }
  .f-row .meta { color: var(--faint); font-size: var(--text-2xs); font-family: var(--font-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .f-row .ui-dot { width: 6px; height: 6px; }

  /* The file */
  .pane-detail { display: flex; flex-direction: column; position: relative; }
  .f-head { display: flex; align-items: center; gap: 8px; padding: 14px 18px 12px 22px; position: sticky; top: 0; z-index: 4;
    background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .f-head.lined { box-shadow: 0 1px 0 var(--line); }
  .f-title { min-width: 0; flex: 1; display: grid; gap: 2px; }
  .f-title h2 { font-size: var(--text-lg); font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .f-title .sub { display: flex; align-items: center; gap: 6px; font-size: var(--text-xs); color: var(--muted); min-width: 0; white-space: nowrap; }
  .f-title .sub > * { flex: none; }
  .f-title .sub .path { flex: 0 1 auto; overflow: hidden; text-overflow: ellipsis; border: 0; background: none; padding: 0; color: var(--muted); font: inherit; font-family: var(--font-mono); font-size: var(--text-2xs); direction: rtl; text-align: left; }
  .f-title .sub .path:hover { color: var(--fg); }
  .f-title .sub .ui-status { font-size: var(--text-xs); font-weight: 550; }
  .f-back { display: none; }
  .f-body { flex: 1 0 auto; }
  .f-body > .ui-code { padding-bottom: 80px; }
  .f-body > .ui-code .pce-line::before { cursor: pointer; }
  .pane-detail.editing { overflow: hidden; }
  .pane-detail.editing .f-body { flex: 1 1 0; min-height: 0; }
  .f-editor { display: grid; height: 100%; }
  .f-editor > .ui-code { height: 100%; padding-bottom: 40px; }
  .f-doc { padding-top: 18px; }
  .f-doc .ui-prose { max-width: 76ch; }
  .f-doc .ui-prose h1, .f-doc .ui-prose h2 { padding-bottom: .3em; }
  .f-doc .ui-prose h1:first-child { margin-top: 0; font-size: var(--text-xl); }
  .f-doc .ui-prose pre { padding: 14px 16px; }
  .f-doc .ui-prose img { max-width: 100%; }
  .f-doc .ui-prose table { display: table; }
  .f-readme-label { display: flex; align-items: center; gap: 8px; }
  .f-media { display: grid; place-items: center; padding: 32px; min-height: 60%; }
  .f-media img { max-height: 78vh; border-radius: var(--radius-sm); box-shadow: var(--shadow-sm);
    background: repeating-conic-gradient(var(--surface) 0 25%, transparent 0 50%) 0 0 / 16px 16px; }
  .f-media video, .f-media audio { max-width: 100%; }
  .f-pdf { width: 100%; height: calc(100dvh - 80px); border: 0; display: block; }
  .f-diff { margin: 4px 18px 80px 22px; }
  .f-diff .lines { max-height: none !important; }
  .f-diff .l { display: grid; grid-template-columns: 3.2em 3.2em 1fr; padding: 0; }
  .f-diff .l > .n { color: var(--faint); text-align: right; padding-right: .9em; user-select: none; font-variant-numeric: tabular-nums; }
  .f-diff .l > .t { padding-left: .4em; }
  .f-diff .l.gap { padding: 6px 12px; display: block; background: var(--surface); }
  .f-since { margin: 2px 22px 10px; font-size: var(--text-xs); color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .f-pad { padding: 4px 22px 80px; }
  .f-recents { padding: 0; margin: 0 -10px; }
  .f-recents .ui-row { padding: 8px 10px; color: inherit; text-decoration: none; }
  .f-recents .title { font-size: var(--text-sm); }
  .f-recents .sub { font-family: var(--font-mono); font-size: var(--text-2xs); color: var(--faint); }
  .f-recents .lead { color: var(--faint); }
  .f-table-wrap { overflow: auto; border-radius: var(--radius); background: var(--surface); }
  .f-table-wrap td { font-family: var(--font-mono); font-size: var(--text-xs); white-space: nowrap; max-width: 36ch; overflow: hidden; text-overflow: ellipsis; }
  .f-table-wrap td.null { color: var(--faint); }
  .f-pager { display: flex; align-items: center; gap: 8px; margin-top: 12px; font-size: var(--text-xs); color: var(--muted); }

  /* Selected lines: a floating bar */
  .f-selbar { position: sticky; bottom: 18px; margin: -64px auto 18px; width: max-content; max-width: calc(100% - 32px); z-index: 5; display: flex; align-items: center; gap: 4px;
    padding: 5px 6px 5px 16px; border-radius: var(--radius-pill); background: var(--surface-overlay); box-shadow: var(--shadow-lg); font-size: var(--text-sm); }
  .f-selbar b { font-weight: 650; margin-right: 6px; font-variant-numeric: tabular-nums; }
  .f-selbar[hidden] { display: none; }

  /* Search */
  dialog.f-search { width: min(620px, calc(100vw - 24px)); margin-top: 12vh; padding: 0; }
  .f-search .q { display: flex; align-items: center; gap: 10px; padding: 14px 18px; border-bottom: 1px solid var(--line); color: var(--faint); }
  .f-search .q input { flex: 1; border: 0; background: none; box-shadow: none; padding: 0; height: 26px; font-size: var(--text-base); color: var(--fg); outline: 0; }
  .f-search .res { max-height: min(56vh, 460px); overflow: auto; padding: 6px; }
  .f-search .ui-option .desc { font-family: var(--font-mono); font-size: var(--text-2xs); direction: rtl; text-align: left; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .f-search .ui-option > span:nth-child(2) { min-width: 0; flex: 1; }
  .f-search .ui-option mark { background: none; color: var(--accent); font-weight: 700; }
  .f-search .ui-label { padding: 8px 10px 4px; display: block; }

  @media (max-width: 720px) {
    .f-back { display: inline-grid; }
    .f-head { padding: 10px 12px 10px 8px; flex-wrap: wrap; row-gap: 4px; }
    .f-head > .f-title { flex: 1 1 calc(100% - 48px); }
    .f-head > .f-title ~ * { order: 2; }
    .f-head > .f-title + * { margin-left: 40px; }
    .f-head > .f-title ~ [data-a="more"] { margin-left: auto; }
    .f-head .ui-seg > button { padding: 0 10px; }
    .f-head [data-a="ask"] { display: none; }
    .f-diff { margin: 4px 8px 80px; }
    .f-diff .l { grid-template-columns: 0 2.6em 1fr; }
    .f-diff .l > .n:first-child { visibility: hidden; }
    .f-pad { padding: 4px 14px 80px; }
    .crumbs > button:not(:last-child), .crumbs > .sep:not(:nth-last-child(2)) { display: none; }
  }
</style>
</head>
<body class="ui-app">
  <header class="ui-toolbar">
    <button class="ui-combo place" id="place" title="Places"><span data-icon="house"></span><span>Home</span><span data-icon="chevron-down"></span></button>
    <nav class="crumbs" id="crumbs" aria-label="Folder path"></nav>
    <button class="ui-icon-btn plain" id="searchBtn" title="Find a file (Ctrl P)"><span data-icon="search"></span></button>
    <button class="ui-icon-btn plain" id="filterBtn" title="Show and sort"><span data-icon="list-filter"></span></button>
  </header>
  <div class="ui-split" id="split">
    <section class="pane-list" id="listPane"><div class="ui-loading" style="margin: 16px"></div></section>
    <section class="pane-detail" id="detail"></section>
  </div>

  <dialog class="ui-dialog f-search" id="search" aria-label="Find a file">
    <div class="q"><span data-icon="search"></span><input id="sq" placeholder="Find a file by name" autocomplete="off" spellcheck="false"><kbd>Esc</kbd></div>
    <div class="res" id="sres"></div>
  </dialog>

  <dialog class="ui-dialog" id="confirm">
    <header id="cTitle"></header>
    <div class="content" id="cBody"></div>
    <footer id="cFoot"></footer>
  </dialog>

  <script type="module" src="files.js"></script>
</body>
</html>
