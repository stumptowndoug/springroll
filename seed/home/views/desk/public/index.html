<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Springroll">
<meta name="theme-color" content="#18191c" id="themeColor">
<title>Springroll</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-256.png">
<link rel="stylesheet" href="ui/theme.css">
<link rel="stylesheet" href="app/app.css">
<link rel="stylesheet" href="app/thread.css">
<link rel="stylesheet" href="app/pages.css">
<script src="ui/desk.js"></script>
</head>
<body>
<div class="shell" id="shell">
  <aside class="side" id="side">
    <div class="side-top">
      <button class="brand" id="brand" title="Home (Ctrl+0)"><svg class="brand-mark" viewBox="0 0 512 512" aria-hidden="true"><use href="ui/logos.svg#springroll"/></svg><span>Springroll</span></button>
      <div class="ui-spacer"></div>
      <button class="ui-icon-btn plain" id="settingsBtn" title="Settings and connections (Ctrl+,)" data-icon="settings"></button>
      <button class="ui-icon-btn plain hide-mobile" id="collapse" title="Hide sidebar (Ctrl+B)" data-icon="panel-left-close"></button>
    </div>
    <button class="search-btn" id="launchBtn"><i data-icon="search" data-icon-size="sm"></i><span>Search or jump to…</span><kbd>Ctrl K</kbd></button>
    <nav class="side-nav" id="nav"></nav>
    <div class="side-scroll">
      <section class="side-sec" id="viewsSec">
        <header><span>Apps</span><button class="add" id="addView" title="Build an app" data-icon="plus" data-icon-size="sm"></button></header>
        <div id="viewList"></div>
      </section>
      <section class="side-sec" id="chatsSec">
        <header><span>Chats</span><button class="add" id="newChatSide" title="New chat" data-icon="plus" data-icon-size="sm"></button></header>
        <div id="chatList"></div>
      </section>
    </div>
    <section class="side-sec usage" id="usage" hidden aria-label="Utilization"></section>
    <div class="side-foot">
      <div class="chips" id="chips"></div>
    </div>
  </aside>
  <div class="scrim-side" id="scrimSide"></div>
  <main class="main" id="main">
    <div class="mobile-bar" id="mobileBar">
      <button class="ui-icon-btn plain" id="menuBtn" data-icon="menu" title="Menu"></button>
      <span class="mobile-title" id="mobileTitle"></span>
      <button class="ui-icon-btn plain" id="mobileNew" data-icon="square-pen" title="New chat"></button>
    </div>
    <button class="ui-icon-btn plain expand-side" id="expandSide" title="Show sidebar (Ctrl+B)" data-icon="panel-left-open"></button>
    <div class="pages" id="pages"></div>
  </main>
  <aside class="panel" id="panel"></aside>
</div>
<button class="exit-focus" id="exitFocus">Exit focus · Esc</button>
<script type="module" src="app/main.js"></script>
</body>
</html>
