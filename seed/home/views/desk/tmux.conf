# The agent's tmux session, as seen in the Desk's terminal pane.
set -g mouse on
set -g history-limit 50000
set -g default-terminal "tmux-256color"
set -g status-style "bg=#16171a,fg=#6b6f78"
set -g status-left " agent "
set -g status-right ""
set -g window-status-format ""
set -g window-status-current-format ""
